<!-- SheetJS — used only by the "درون‌ریزی از اکسل" bulk-import feature to read .xlsx/.csv files client-side -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    color-scheme: dark;
    --bg:#131208; --bg-deep:#0E0D06; --surface:#1D1B12; --surface-2:#252216; --surface-2s:#252216; --surface-3:#2E2A1B;
    --border:#3A3527; --border-soft:#2A2718;
    --gold:#C9A227; --gold-soft:#E8C766; --gold-dim:#8C7220; --gold-glow:rgba(201,162,39,.16);
    --ink:#EFE9D9; --ink-dim:#A8A18C; --ink-faint:#8F8968;
    --green:#68B57E; --green-bg:#1C2A20; --red:#E08A7E; --red-bg:#2E1F1C;
    --radius:12px; --radius-sm:9px;
    --shadow-card:0 1px 2px rgba(0,0,0,.28), 0 6px 22px -12px rgba(0,0,0,.55);
    --font-fa:'Vazirmatn',Tahoma,sans-serif;
    --font-mono:'Vazirmatn',Tahoma,sans-serif; /* ارقام وزیرمتن ذاتاً هم‌عرض‌اند؛ فونت جدا لازم نیست */
  }
  *{box-sizing:border-box;}
  .ledger-root{
    color-scheme: dark;
    forced-color-adjust: none;
    direction:rtl; font-family:var(--font-fa); background:var(--bg); color:var(--ink);
    border:1px solid var(--border-soft); border-radius:14px; overflow:hidden;
    max-width:100%; margin:0; line-height:1.65; font-size:16px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .ledger-root *{font-family:inherit;}
  .ledger-root .num{font-family:var(--font-fa); font-feature-settings:'tnum' 1,'lnum' 1; letter-spacing:.01em;}
  .ledger-root h1,.ledger-root h2,.ledger-root h3{margin:0; font-weight:800;}
  .ledger-root button{font-family:inherit; cursor:pointer;}
  .ledger-root input,.ledger-root select{font-family:inherit; background:var(--surface-2s); border:1px solid var(--border); color:var(--ink); border-radius:8px; padding:7px 11px; font-size:15.5px; width:100%; transition:border-color .15s, box-shadow .15s;}
  .ledger-root input:focus,.ledger-root select:focus{outline:none; border-color:var(--gold-dim); box-shadow:0 0 0 3px var(--gold-glow);}
  .ledger-root input::placeholder{color:var(--ink-faint);}
  .ledger-root input[readonly]{color:var(--ink); opacity:1; background:var(--surface-2s);}
  .ledger-root :focus-visible{outline:2px solid var(--gold-dim); outline-offset:2px;}
  .ledger-root ::-webkit-scrollbar{height:8px; width:8px;}
  .ledger-root ::-webkit-scrollbar-track{background:transparent;}
  .ledger-root ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  .ledger-root ::-webkit-scrollbar-thumb:hover{background:var(--gold-dim);}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 22px; background:linear-gradient(135deg,#1C1A0F 0%,#15130B 55%,#171407 100%); border-bottom:1px solid var(--border-soft); position:relative;}
  .topbar::after{content:''; position:absolute; inset-inline:0; bottom:-1px; height:1px; background:linear-gradient(90deg,transparent,var(--gold-dim) 30%,var(--gold-dim) 70%,transparent); opacity:.5;}
  .brand{display:flex; align-items:center; gap:13px;}
  .brand h1{font-size:20px; letter-spacing:.2px;}
  .brand p{margin:2px 0 0; font-size:13px; color:var(--ink-dim);}
  .topbar-actions{display:flex; gap:8px; align-items:center;}

  .btn{border:1px solid var(--border); background:var(--surface-2); color:var(--ink); padding:7px 14px; border-radius:8px; font-size:14.5px; font-weight:600; transition:border-color .15s, color .15s, background .15s, transform .08s;}
  .btn:hover{border-color:var(--gold-dim); color:var(--gold-soft);}
  .btn:active{transform:translateY(1px);}
  .btn-gold{background:linear-gradient(180deg,var(--gold-soft) -40%,var(--gold) 60%); border-color:var(--gold); color:#191504; box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 4px 14px -6px rgba(201,162,39,.5);}
  .btn-gold:hover{background:var(--gold-soft); color:#191504; border-color:var(--gold-soft);}
  .btn-ghost{background:transparent;}
  .btn-danger{color:var(--red); border-color:var(--red-bg);}

<script>
(function(){

/* ---------- state ---------- */
let TXNS=[], WITHDRAWALS=[], PRICES={}, PRICES_UPDATED_AT={}, SNAPSHOTS=[], LADDERS={}, USERS=[];
let CATEGORIES=[]; // {id, name, isDefault, createdAt} — managed centrally now (v2); rename/delete from the "کتگوری‌ها" tab
let ACCOUNTS=[];   // [{id, name, openingBalance, balance, createdAt}, ...] — GLOBAL cash accounts (à la Microsoft Money), shared across every portfolio
let PORTFOLIOS=[]; // {id, name, createdAt} — independent "accounts", à la Microsoft Money
// There is no persistent "active portfolio" — Dashboard/Holdings/Sold/Trend/Ladders always
// show every portfolio combined. addTabPortfolioId is a lightweight, non-persisted UI
// convenience: which portfolio's transaction-entry form + summary the "ثبت تراکنش" tab is
// currently showing. Set on render (defaults to the first portfolio) and updated when the
// admin picks a different one, or clicks a portfolio's name in the "سبدها" tab.
let addTabPortfolioId=null;
let CURRENT_USER=null;
let editingTxnId=null;
let editingUserId=null;
let editingPortfolioId=null;
let manageView=null; // 'add' | 'categories' | 'accounts' | 'users' — which section the unified «مدیریت» tab is showing
let editingCategoryId=null;
let editingAccountId=null;
let expandedAccountId=null; // which account's row is expanded to show its deposit/withdraw forms + history
let ACCOUNT_MOVEMENTS_CACHE={}; // {[accountId]: [{...cash_movement}, ...]} — fetched lazily when a row expands
let trendMode='value';
let trendChartType='line';
let expandedHoldings=new Set();
let ladderOpenCats=new Set(); // keys "pid|cat" — which category cards are expanded in the ladders tab
let ladderOpenAsset={}; // map "pid|cat" -> asset name currently expanded (or absent) in the ladders tab
let dashboardFilter='__all__';
let compositionSort={key:null, dir:1}; // {key: one of investment/value/unrealized/realized/overall/pct/label, dir: 1|-1}
// Per-tab, non-persisted portfolio filters — each tab remembers its own choice independently
// (no shared/global "active portfolio"). '__all__' means combined across every portfolio.
let holdingsFilterPid='__all__';
let holdingsAsOfDate=null; // null = today/current; else a normalized Jalali "YYYY/MM/DD"
let soldFilterPid='__all__';
let trendFilterPid='__all__';
let dashboardPidFilter='__all__';

const PALETTE=['#C9A227','#5B8C7B','#B5483D','#7A6B4F','#6E7E91','#A6694F','#8C7220','#4F6B5B'];
const DEFAULT_LADDERS={
  'کریپتو':[{t:70,w:50},{t:110,w:80},{t:200,w:90}],
  'طلا':[{t:80,w:50},{t:120,w:80},{t:180,w:90}],
  'بورس':[{t:50,w:50},{t:100,w:80},{t:180,w:90}],
  'درآمد ثابت':[{t:20,w:50},{t:40,w:80},{t:60,w:90}],
  'ارز':[{t:30,w:50},{t:60,w:80},{t:100,w:90}],
  'نقره':[{t:50,w:50},{t:100,w:80},{t:150,w:90}],
  'سایر':[{t:50,w:50},{t:100,w:80},{t:150,w:90}]
};
const BASE_CATEGORIES=Object.keys(DEFAULT_LADDERS);
// Tabs a "کاربر عادی" (non-admin) can potentially be granted — «سبدها» and «کاربران» stay
// admin-only regardless, so they're not part of this configurable set.
const TAB_KEYS_PERMISSIBLE=['dashboard','add','holdings','sold','trend','ladders'];
const TAB_LABELS={dashboard:'داشبورد', add:'ثبت تراکنش', holdings:'پرتفوی', sold:'فروخته‌شده', trend:'روند عملکرد', ladders:'پله‌های سود'};

/* ---------- utils ---------- */
const FA_DIGITS='۰۱۲۳۴۵۶۷۸۹';
function toEnDigits(s){ return String(s==null?'':s).replace(/[۰-۹]/g, d=>FA_DIGITS.indexOf(d)); }
function num(v){ const n=parseFloat(toEnDigits(v).replace(/,/g,'')); return isNaN(n)?0:n; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad2(n){ return String(n).padStart(2,'0'); }

function fmt(n,dec){
  dec=dec||0; n = (Math.abs(n)<1e-9)?0:n;
  const f=Math.pow(10,dec); n=Math.round(n*f)/f;
  const sign = n<0?'-':''; 
  return sign+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:dec,minimumFractionDigits:dec});
}
function fmtT(n){ return fmt(n)+' تومان'; }
function fmtPct(n){ return (n>=0?'+':'')+fmt(n,1)+'٪'; }
function plClass(n){ return n>1e-6?'pos':(n<-1e-6?'neg':''); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function div(a,b){ return Math.floor(a/b); }

/* ---------- Jalali (Persian) calendar — backed by the ICU calendar built into the JS engine ----------
   Replaces the old hand-rolled 33-year-cycle approximation, which drifted on a meaningful
   fraction of dates when checked against verified historical Nowruz dates. This implementation
   is cross-checked against multiple independently documented Nowruz dates and against the
   astronomically computed 2025/2026 equinox rule, with zero mismatches over a 300+ year
   round-trip test. */
const _persianFmt = (function(){
  try{ return new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'}); }
  catch(e){ return null; }
})();
function gregorianToJalali(gy,gm,gd){
  if(!_persianFmt) return [gy,gm,gd]; // extremely old browser fallback, should not happen in practice
  const dt=new Date(Date.UTC(gy,gm-1,gd,12,0,0));
  const parts=_persianFmt.formatToParts(dt);
  const o={}; parts.forEach(p=>o[p.type]=p.value);
  return [parseInt(o.year),parseInt(o.month),parseInt(o.day)];
}
function _epochDay(gy,gm,gd){ return Math.floor(Date.UTC(gy,gm-1,gd,12,0,0)/86400000); }
function _fromEpochDay(days){
  const dt=new Date(days*86400000 + 12*3600000);
  return [dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate()];
}
function _cmpJalali(a,b){ if(a[0]!==b[0]) return a[0]-b[0]; if(a[1]!==b[1]) return a[1]-b[1]; return a[2]-b[2]; }
function jalaliToGregorian(jy,jm,jd){
  const target=[jy,jm,jd];
  const approxGy=jy+621;
  let lo=_epochDay(approxGy-1,1,1), hi=_epochDay(approxGy+2,12,31);
  while(lo<hi){
    const mid=Math.floor((lo+hi)/2);
    const g=_fromEpochDay(mid);
    const j=gregorianToJalali(g[0],g[1],g[2]);
    if(_cmpJalali(j,target)<0) lo=mid+1; else hi=mid;
  }
  return _fromEpochDay(lo);
}
function jalaliToEpochDay(jy,jm,jd){ const g=jalaliToGregorian(jy,jm,jd); return _epochDay(g[0],g[1],g[2]); }
function todayJalali(){
  const d=new Date();
  const [jy,jm,jd]=gregorianToJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
  return `${jy}/${pad2(jm)}/${pad2(jd)}`;
}
function normalizeJalali(str){
  const m=toEnDigits(str).trim().match(/^(\d{3,4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(!m) return null;
  const jy=parseInt(m[1]), jm=parseInt(m[2]), jd=parseInt(m[3]);
  if(jm<1||jm>12||jd<1||jd>31) return null;
  // round-trip through the real calendar to reject dates that don't exist (e.g. 31st of a 30-day month)
  const g=jalaliToGregorian(jy,jm,jd);
  const back=gregorianToJalali(g[0],g[1],g[2]);
  if(back[0]!==jy||back[1]!==jm||back[2]!==jd) return null;
  return `${String(jy).padStart(4,'0')}/${pad2(jm)}/${pad2(jd)}`;
}
function jalaliSortKey(str){
  const m=(str||'').match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
  if(!m) return 0;
  return parseInt(m[1])*10000+parseInt(m[2])*100+parseInt(m[3]);
}
function jalaliToExactDays(str){
  const m=(str||'').match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
  if(!m) return 0;
  return jalaliToEpochDay(parseInt(m[1]),parseInt(m[2]),parseInt(m[3]));
}
function fmtDuration(days){
  if(days<0) days=0;
  const months=Math.floor(days/30), rem=days%30;
  if(months<=0) return `${rem} روز`;
  if(rem===0) return `${months} ماه`;
  return `${months} ماه و ${rem} روز`;
}

function toast(msg,isErr){
  const box=document.getElementById('toastBox');
  const el=document.createElement('div');
  el.className='toast'+(isErr?' err':'');
  el.textContent=msg;
  box.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); },2600);
}

/* ---------- API client ----------
   Talks to the Flask+SQLite backend (see /daftar_backend). By default this assumes the
   frontend is served BY that same backend (see app/__init__.py's "/" route), so a relative
   '/api' base is same-origin and needs no CORS. If you ever serve this HTML file separately
   from the API, set window.__API_BASE__ = 'https://your-api-host' before this script runs. */
const API_BASE = (typeof window!=='undefined' && window.__API_BASE__) || '/api';
const TOKEN_KEY = 'daftar_darayi_token';
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; } }
function setToken(t){ try{ if(t) localStorage.setItem(TOKEN_KEY,t); else localStorage.removeItem(TOKEN_KEY); }catch(e){} }

function setSaveStatus(state){
  const el=document.getElementById('saveStatus');
  const btn=document.getElementById('btnRetrySave');
  if(!el) return;
  if(btn) btn.classList.add('hidden'); // per-action API calls handle their own retry (just resubmit); no generic "retry all" needed anymore
  clearTimeout(window.__saveStatusTimer);
  if(state==='saving'){ el.textContent='⏳ در حال ذخیره...'; el.style.color='var(--ink-dim)'; }
  else if(state==='ok'){ el.textContent='✓ ذخیره شد'; el.style.color='var(--green)'; window.__saveStatusTimer=setTimeout(()=>{ if(el) el.textContent=''; },2000); }
  else if(state==='error'){ el.textContent='⚠ ذخیره نشد'; el.style.color='var(--red)'; }
}

// Central fetch wrapper: adds the bearer token, parses JSON, and throws a plain Error whose
// message is the server's own Persian error text (from ApiError in the backend) so every
// call site can just `catch(e){ toast(e.message, true); }`.
async function apiFetch(path, {method='GET', body, auth=true}={}){
  const headers={'Content-Type':'application/json'};
  if(auth){ const t=getToken(); if(t) headers['Authorization']='Bearer '+t; }
  let res;
  try{
    res = await fetch(API_BASE+path, {method, headers, body: body!==undefined? JSON.stringify(body) : undefined});
  }catch(e){
    throw new Error('اتصال به سرور برقرار نشد. مطمئن شوید بک‌اند در حال اجراست.');
  }
  let data=null;
  try{ data = await res.json(); }catch(e){ /* empty body, e.g. 204 */ }
  if(!res.ok){
    if(res.status===401){ setToken(null); CURRENT_USER=null; renderAuth(); }
    throw new Error((data && data.error) || `خطای سرور (${res.status})`);
  }
  return data;
}
// Wraps a mutating apiFetch call with the same save-status indicator the old storage layer
// showed, so the UI still gives the "⏳ در حال ذخیره... / ✓ ذخیره شد / ⚠ ذخیره نشد" feedback.
async function apiSave(path, opts){
  setSaveStatus('saving');
  try{
    const r = await apiFetch(path, opts);
    setSaveStatus('ok');
    return r;
  }catch(e){
    setSaveStatus('error');
    throw e;
  }
}

// Loads every collection this session needs from the API and populates the same global
// arrays the rest of the app already reads from (TXNS, WITHDRAWALS, ...) — the rendering
// code below is entirely unaware that the source is now a network call instead of
// window.storage. Individual requests are wrapped so that one 403 (e.g. a restricted user
// hitting an endpoint outside their allowedTabs) doesn't abort the whole load.
async function safeLoad(promiseFactory, fallback){
  try{ return await promiseFactory(); }
  catch(e){ console.warn('load skipped:', e.message); return fallback; }
}
async function loadAllFromApi(){
  if(!getToken()){ return; }
  const me = await safeLoad(()=>apiFetch('/auth/me'), null);
  if(!me){ setToken(null); CURRENT_USER=null; return; }
  CURRENT_USER = {id:me.id, username:me.username, displayName:me.displayName, role:me.role, allowedTabs:me.allowedTabs};

  PORTFOLIOS = await safeLoad(()=>apiFetch('/portfolios'), []);
  CATEGORIES = await safeLoad(()=>apiFetch('/categories'), []);

  const [txnsByPortfolio, wdByPortfolio, laddersByPortfolio, snapByPortfolio] = await Promise.all([
    Promise.all(PORTFOLIOS.map(p=>safeLoad(()=>apiFetch(`/portfolios/${p.id}/transactions`), []))),
    Promise.all(PORTFOLIOS.map(p=>safeLoad(()=>apiFetch(`/portfolios/${p.id}/withdrawals`), []))),
    Promise.all(PORTFOLIOS.map(p=>safeLoad(()=>apiFetch(`/portfolios/${p.id}/ladders`), {}))),
    Promise.all(PORTFOLIOS.map(p=>safeLoad(()=>apiFetch(`/portfolios/${p.id}/snapshots`), []))),
  ]);
  TXNS = txnsByPortfolio.flat();
  WITHDRAWALS = wdByPortfolio.flat();
  SNAPSHOTS = snapByPortfolio.flat();
  LADDERS = {};
  PORTFOLIOS.forEach((p,i)=>{ LADDERS[p.id]=laddersByPortfolio[i]; });
  ACCOUNTS = await safeLoad(()=>apiFetch('/accounts'), []); // global — shared across every portfolio

  const priceRows = await safeLoad(()=>apiFetch('/prices'), {});
  PRICES={}; PRICES_UPDATED_AT={};
  Object.keys(priceRows).forEach(asset=>{ PRICES[asset]=priceRows[asset].price; PRICES_UPDATED_AT[asset]=priceRows[asset].updatedAt; });

  USERS = isAdmin() ? await safeLoad(()=>apiFetch('/users'), [CURRENT_USER]) : [CURRENT_USER];
}

/* ---------- auth (real backend-issued JWT — see /daftar_backend) ----------
   The token from /api/auth/login (or /register) is kept in localStorage (TOKEN_KEY above) so
   the session survives a page reload; the actual password check, hashing, and role
   enforcement all happen server-side now — this file only holds the token and the current
   user's own public profile (never a password). */
function isAdmin(){ return !!CURRENT_USER && CURRENT_USER.role==='admin'; }
function requireAdmin(actionLabel){
  if(!isAdmin()){ toast(`این عملیات (${actionLabel}) فقط برای «مدیر» مجاز است.`, true); return false; }
  return true;
}
// Which of the 6 configurable tabs a user can see. Admins always get all of them (نothing to
// configure). A non-admin with no allowedTabs field yet (existing users from before this
// feature existed, or a user record missing the field for any reason) defaults to every tab —
// so turning this feature on never silently locks anyone out who wasn't explicitly restricted.
function userAllowedTabs(u){
  if(!u) return [];
  if(u.role==='admin') return TAB_KEYS_PERMISSIBLE.slice();
  return Array.isArray(u.allowedTabs) ? u.allowedTabs : TAB_KEYS_PERMISSIBLE.slice();
}
function isTabAllowedForCurrentUser(tabKey){
  if(!CURRENT_USER) return false;
  if(CURRENT_USER.role==='admin') return true;
  return userAllowedTabs(CURRENT_USER).includes(tabKey);
}
async function logout(){
  CURRENT_USER=null;
  setToken(null);
  renderAuth();
}
function updateUserBar(){
  const info=document.getElementById('userInfo');
  const btnLogout=document.getElementById('btnLogout');
  const btnAlerts=document.getElementById('btnAlerts');
  const btnRestore=document.getElementById('btnRestoreTrigger');
  const tabPortfoliosBtn=document.getElementById('tabPortfoliosBtn');
  const tabManageBtn=document.querySelector('.tab[data-tab="manage"]');
  if(!CURRENT_USER){
    info.textContent=''; btnLogout.classList.add('hidden');
    btnAlerts.classList.add('hidden');
    btnRestore.classList.add('hidden');
    if(tabPortfoliosBtn) tabPortfoliosBtn.classList.add('hidden');
    if(tabManageBtn) tabManageBtn.classList.add('hidden');
    return;
  }
  const roleLabel = CURRENT_USER.role==='admin' ? 'مدیر' : 'کاربر عادی (فقط‌خواندنی)';
  info.textContent = `${CURRENT_USER.displayName} · ${roleLabel}`;
  btnLogout.classList.remove('hidden');
  btnAlerts.classList.remove('hidden');
  updateAlertsBadge();
  btnRestore.classList.add('hidden'); // local-file restore isn't supported with the API backend; data now lives on the server
  if(tabPortfoliosBtn) tabPortfoliosBtn.classList.toggle('hidden', !isAdmin());
  // "مدیریت" (ثبت تراکنش + کتگوری‌ها + حساب‌ها + کاربران) is visible to admins always, and to
  // a regular user only if they've been granted the "add" permission — categories/accounts/
  // users stay admin-only inside it regardless (enforced again server-side, see require_admin).
  if(tabManageBtn) tabManageBtn.classList.toggle('hidden', !isAdmin() && !isTabAllowedForCurrentUser('add'));
  // Show/hide each of the other configurable tab buttons per this user's allowed-tabs list.
  // Admins always see all of them — nothing to restrict for a manager.
  let anyAllowed=isAdmin() || isTabAllowedForCurrentUser('add');
  TAB_KEYS_PERMISSIBLE.forEach(tk=>{
    const btn=document.querySelector(`.tab[data-tab="${tk}"]`);
    if(!btn) return; // 'add' has no standalone nav button anymore — handled above via tabManageBtn
    const allowed = isTabAllowedForCurrentUser(tk);
    btn.classList.toggle('hidden', !allowed);
    if(allowed) anyAllowed=true;
  });
  if(!isAdmin() && !document.getElementById('tab-portfolios').classList.contains('hidden')){
    switchTab('dashboard');
  }
  // A user with literally zero allowed tabs can't rely on ".tab.active" detection to persist
  // across repeated updateUserBar() calls (renderAuth() calls it once, then renderAll() calls it
  // again right after — by the second call every "active" class has already been cleared by the
  // first call's own handling below, so re-deriving "am I locked out" from the DOM's active-tab
  // state would flip-flop). Decide this directly from anyAllowed instead, and make it idempotent.
  if(!isAdmin() && !anyAllowed){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    ['dashboard','manage','holdings','sold','trend','ladders','portfolios'].forEach(n=>{
      document.getElementById('tab-'+n).classList.add('hidden');
    });
    const main=document.querySelector('main') || document.getElementById('appShell');
    if(main && !document.getElementById('noAccessNotice')){
      const notice=document.createElement('div');
      notice.className='card'; notice.id='noAccessNotice';
      notice.style.margin='20px auto'; notice.style.maxWidth='480px'; notice.style.textAlign='center';
      notice.innerHTML='<p class="small-note" style="font-size:16px;">دسترسی شما به هیچ بخشی از سامانه فعال نیست. لطفاً با مدیر سامانه تماس بگیرید.</p>';
      main.appendChild(notice);
    }
    return;
  }
  const old=document.getElementById('noAccessNotice'); if(old) old.remove();
  // If the currently-active tab is one of the 6 configurable ones and this user has just lost
  // access to it (e.g. an admin unchecked it while they were on it, or on login), redirect them
  // to the first tab they DO still have.
  const activeTabBtn=document.querySelector('.tab.active');
  const activeTab=activeTabBtn? activeTabBtn.dataset.tab : null;
  if(!isAdmin() && activeTab && TAB_KEYS_PERMISSIBLE.includes(activeTab) && !isTabAllowedForCurrentUser(activeTab)){
    const firstAllowed = TAB_KEYS_PERMISSIBLE.find(tk=>isTabAllowedForCurrentUser(tk));
    if(firstAllowed) switchTab(firstAllowed);
  }
}
function renderAuth(){
  const authEl=document.getElementById('authScreen');
  const appShell=document.getElementById('appShell');
  if(CURRENT_USER){
    authEl.classList.add('hidden');
    appShell.classList.remove('hidden');
    updateUserBar();
    return;
  }
  appShell.classList.add('hidden');
  authEl.classList.remove('hidden');
  updateUserBar();
  authEl.innerHTML = `<div class="card" style="max-width:420px;margin:40px auto;"><div class="empty">در حال بارگذاری...</div></div>`;
  apiFetch('/auth/bootstrap-status', {auth:false})
    .then(r=>{ r.hasUsers ? renderLoginForm() : renderFirstRunSetup(); })
    .catch(e=>{ authEl.innerHTML = `<div class="card" style="max-width:420px;margin:40px auto;"><div class="empty">${esc(e.message)}</div></div>`; });
}

/* ---------- domain logic ---------- */
function categoryName(id){ const c=CATEGORIES.find(x=>x.id===id); return c? c.name : '—'; }
function categoryIdByName(name){
  const c=CATEGORIES.find(x=>x.name.toLowerCase()===String(name||'').trim().toLowerCase());
  return c? c.id : null;
}
// Every category actually used across all loaded transactions/ladders, PLUS every managed
// category — in practice these coincide (CATEGORIES is the full managed list), but this stays
// safe even if a portfolio's LADDERS reference a category_id that's since been renamed/deleted.
function knownCategoryIds(){
  const s=new Set(CATEGORIES.map(c=>c.id));
  TXNS.forEach(t=>{ if(t.categoryId) s.add(t.categoryId); });
  return Array.from(s);
}
function knownAssets(){
  const s=new Set(); TXNS.forEach(t=>s.add(t.asset)); return Array.from(s);
}
function lastInfoForAsset(name){
  const list=TXNS.filter(t=>t.asset===name).sort((a,b)=>jalaliSortKey(a.date)-jalaliSortKey(b.date));
  if(!list.length) return null;
  const last=list[list.length-1];
  return {categoryId:last.categoryId, location:last.location};
}
// Cash accounts for one portfolio, and the running balance already computed server-side.
function allAccounts(){ return ACCOUNTS; }
function accountName(id){ const a=ACCOUNTS.find(x=>x.id===id); return a? a.name : '—'; }
// Mirrors business.py's txn_cash_impact()/cash_movement_impact() — how much one transaction
// or one deposit/withdraw/transfer row moves an account's balance, signed.
function txnCashImpact(t){
  const fee=t.fee||0;
  if(t.type==='buy') return -(t.amount+fee);
  if(t.type==='sell') return t.amount-fee;
  if(t.type==='dividend') return t.amount-fee;
  return 0;
}
function movementCashImpact(m){
  if(m.type==='deposit'||m.type==='transfer_in') return m.amount;
  if(m.type==='withdraw'||m.type==='transfer_out') return -m.amount;
  return 0;
}
function movementTypeLabel(type){
  return {deposit:'واریز', withdraw:'برداشت', transfer_in:'انتقال ورودی', transfer_out:'انتقال خروجی'}[type] || type;
}

/* ---------- portfolios ---------- */
function portfolioName(pid){ const p=PORTFOLIOS.find(x=>x.id===pid); return p? p.name : '—'; }
function txnsForPortfolio(pid){ return TXNS.filter(t=>t.portfolioId===pid); }
// Ladders are independent per portfolio (per الهه's design decision) — LADDERS is nested as
// {[portfolioId]: {cat:[...]}}. This lazily creates a portfolio's ladder map on first access.
function ensurePortfolioLadders(pid){
  if(!LADDERS[pid]) LADDERS[pid]=JSON.parse(JSON.stringify(DEFAULT_LADDERS));
  return LADDERS[pid];
}

function computeHoldings(txns){
  txns = txns || TXNS;
  const assets={}, closedList=[];
  const lastClosedForAsset={};
  const sorted=[...txns].sort((a,b)=> jalaliSortKey(a.date)-jalaliSortKey(b.date) || (a.ts-b.ts));
  for(const t of sorted){
    const name=t.asset;
    const fee=t.fee||0;
    if(!assets[name]) assets[name]={qty:0,avgCost:0,costBasis:0,realizedPL:0,dividend:0,categoryId:t.categoryId,location:t.location||'',firstBuy:null,lotInvested:0,lotReceived:0};
    const a=assets[name];
    if(t.categoryId) a.categoryId=t.categoryId;
    if(t.location) a.location=t.location;
    if(t.type==='buy'){
      // The fee is added straight into the cost basis (see business.py for the server-side
      // equivalent) — a 100 unit buy with a 2 unit fee costs 102 from here on.
      const buyTotal=t.amount+fee;
      if(a.qty<=1e-9){ a.firstBuy=t.date; a.lotInvested=0; a.lotReceived=0; }
      a.costBasis += buyTotal;
      a.qty += t.qty;
      a.avgCost = a.qty>1e-9 ? a.costBasis/a.qty : 0;
      a.lotInvested += buyTotal;
    } else if(t.type==='sell'){
      // Defensive clamp only: real prevention of overselling happens at data-entry time
      // (see validateSellQty). If it ever happens anyway (e.g. legacy data), we still
      // avoid negative holdings, but we no longer let it fabricate phantom realized profit
      // beyond what the owned quantity could have produced.
      const sellNet=t.amount-fee; // what actually lands back in cash after the fee
      const sellQty=Math.min(t.qty, a.qty);
      const proportionalCost=sellQty*a.avgCost;
      const proportionalProceeds = t.qty>1e-9 ? sellNet*(sellQty/t.qty) : 0;
      a.realizedPL += proportionalProceeds - proportionalCost;
      a.lotReceived += proportionalProceeds;
      a.qty -= sellQty;
      if(a.qty<1e-6) a.qty=0;
      a.costBasis = a.qty*a.avgCost;
      if(a.qty===0){
        const rec={
          asset:name, categoryId:a.categoryId,
          profit: a.realizedPL + a.dividend,
          firstBuy: a.firstBuy, lastSell: t.date,
          invested: a.lotInvested, received: a.lotReceived
        };
        closedList.push(rec);
        lastClosedForAsset[name]=rec;
        a.avgCost=0; a.realizedPL=0; a.dividend=0; a.firstBuy=null; a.lotInvested=0; a.lotReceived=0;
      }
    } else if(t.type==='dividend'){
      const divNet=t.amount-fee;
      if(a.qty>1e-9){
        a.dividend += divNet;
      } else {
        // No open position for this asset right now — this is a dividend paid out after the
        // holding was fully closed. Attribute it to that closed lot instead of letting it
        // silently vanish (or worse, bleed into a future re-purchase of the same asset).
        const lc=lastClosedForAsset[name];
        if(lc) lc.profit += divNet;
      }
    }
  }
  const holdings=[];
  for(const [name,a] of Object.entries(assets)){
    if(a.qty>1e-9){
      const price=PRICES[name]||0;
      const hasPrice = price>1e-9;
      // Until a day price is entered, we assume the position is worth what was paid for it
      // (no gain, no loss) instead of silently valuing it at zero — which used to show up as
      // a fabricated ~100% loss the moment a fresh purchase was recorded, before anyone had
      // a chance to price it.
      const value = hasPrice ? a.qty*price : a.costBasis;
      const unrealized = hasPrice ? value-a.costBasis : 0;
      const unrealizedPct = hasPrice && a.costBasis>1e-6 ? unrealized/a.costBasis*100 : 0;
      const realized = a.realizedPL + a.dividend;
      holdings.push({name,categoryId:a.categoryId,location:a.location,qty:a.qty,avgCost:a.avgCost,
        costBasis:a.costBasis,price,hasPrice,value,unrealized,unrealizedPct,realized,totalPL:unrealized+realized,firstBuy:a.firstBuy});
    }
  }
  holdings.sort((x,y)=>y.value-x.value);
  closedList.sort((x,y)=>jalaliSortKey(y.lastSell)-jalaliSortKey(x.lastSell));
  return {holdings, closed:closedList};
}
// pid is required (not optional/aggregate) — a sell in one portfolio must never be validated
// against another portfolio's quantity of a same-named asset.
function currentQtyForAsset(name, excludeTxnId, pid){
  let txns = txnsForPortfolio(pid);
  if(excludeTxnId) txns = txns.filter(t=>t.id!==excludeTxnId);
  const {holdings}=computeHoldings(txns);
  const h=holdings.find(x=>x.name===name);
  return h? h.qty : 0;
}
function assetHasAnyHistory(name, excludeTxnId, pid){
  return TXNS.some(t=>t.asset===name && t.portfolioId===pid && t.id!==excludeTxnId);
}
// asOfDate (optional, Jalali "YYYY/MM/DD") replays the ledger using only transactions dated on
// or before it — quantity, average cost, and realized profit all come out exactly as they stood
// on that day. Day PRICES aren't tracked historically though (only today's), so "ارزش روز" /
// "سود/زیان فعلی" on an as-of-date view still use today's price — renderHoldings labels that
// clearly rather than pretending to know a past market price we never recorded.
function computeHoldingsForPortfolio(pid, asOfDate){
  let txns = txnsForPortfolio(pid);
  if(asOfDate){
    const cutoff = jalaliSortKey(asOfDate);
    txns = txns.filter(t=>jalaliSortKey(t.date) <= cutoff);
  }
  const {holdings,closed}=computeHoldings(txns);
  holdings.forEach(h=>{ h.portfolioId=pid; h.portfolioName=portfolioName(pid); });
  closed.forEach(c=>{ c.portfolioId=pid; c.portfolioName=portfolioName(pid); });
  return {holdings, closed};
}
// The combined "همه سبدها" view. Critically, this NEVER runs computeHoldings() over raw
// transactions concatenated across portfolios — that would let a sell in one portfolio draw
// down the weighted-average cost basis of the same-named asset in a different portfolio. Each
// portfolio's holdings/closed are computed in full isolation first; only the already-computed
// result ROWS are merged here for display and category aggregation.
function computeHoldingsAllPortfolios(asOfDate){
  let holdings=[], closed=[];
  PORTFOLIOS.forEach(p=>{
    const r=computeHoldingsForPortfolio(p.id, asOfDate);
    holdings=holdings.concat(r.holdings);
    closed=closed.concat(r.closed);
  });
  holdings.sort((x,y)=>y.value-x.value);
  closed.sort((x,y)=>jalaliSortKey(y.lastSell)-jalaliSortKey(x.lastSell));
  return {holdings, closed};
}
// Dashboard always shows every portfolio combined. Holdings/Sold default to combined too, but
// each has its OWN local filter (holdingsFilterPid / soldFilterPid) letting it narrow to one
// portfolio — independent per tab, not a shared "active portfolio".
function currentHoldingsView(pid, asOfDate){
  if(pid && pid!=='__all__' && PORTFOLIOS.some(p=>p.id===pid)) return computeHoldingsForPortfolio(pid, asOfDate);
  return computeHoldingsAllPortfolios(asOfDate);
}
// Renders a small "سبد: [همه سبدها / نام سبد]" filter select, shared by any tab that wants a
// local, independent portfolio filter. Returns '' (no select) when there's only one portfolio,
// since a filter is meaningless with nothing to filter between.
function portfolioFilterSelect(id, selectedPid){
  if(PORTFOLIOS.length<=1) return '';
  return `<select id="${id}" style="max-width:180px;">
    <option value="__all__" ${selectedPid==='__all__'?'selected':''}>همه سبدها</option>
    ${PORTFOLIOS.map(p=>`<option value="${p.id}" ${p.id===selectedPid?'selected':''}>${esc(p.name)}</option>`).join('')}
  </select>`;
}

// Per-transaction realized profit/loss for one asset — walks the same chronological,
// weighted-average-cost logic as computeHoldings() (buy raises avgCost's cost basis,
// sell realizes sellQty*(sellPrice-avgCost), a full exit resets the lot), but keyed by
// transaction id instead of summed into one running total. This is what lets the
// per-asset transaction list show "this specific sale/سیو سود made X تومان" instead of
// only the category-wide "سود تحقق‌یافته" figure — and by construction, summing every
// row's value for an asset always reproduces that same aggregate figure.
function computeAssetTxnRealized(name, pid){
  const result={};
  const sorted=TXNS.filter(t=>t.asset===name && t.portfolioId===pid).sort((a,b)=>jalaliSortKey(a.date)-jalaliSortKey(b.date)||(a.ts-b.ts));
  let qty=0, avgCost=0, costBasis=0, lastClosedTxnId=null;
  for(const t of sorted){
    const fee=t.fee||0;
    if(t.type==='buy'){
      costBasis += t.amount+fee;
      qty += t.qty;
      avgCost = qty>1e-9 ? costBasis/qty : 0;
      lastClosedTxnId=null;
    } else if(t.type==='sell'){
      const sellNet=t.amount-fee;
      const sellQty=Math.min(t.qty, qty);
      const proportionalCost=sellQty*avgCost;
      const proportionalProceeds = t.qty>1e-9 ? sellNet*(sellQty/t.qty) : 0;
      result[t.id]=proportionalProceeds-proportionalCost;
      qty -= sellQty;
      if(qty<1e-6) qty=0;
      costBasis = qty*avgCost;
      if(qty===0){ avgCost=0; lastClosedTxnId=t.id; } else { lastClosedTxnId=null; }
    } else if(t.type==='dividend'){
      const divNet=t.amount-fee;
      if(qty>1e-9){
        result[t.id]=divNet;
      } else if(lastClosedTxnId){
        // Dividend paid after the position was already fully closed — attribute it to the
        // sell that closed it (same rule computeHoldings uses for the closed-lot's profit)
        // rather than letting it float unattached or bleed into a future re-purchase.
        result[lastClosedTxnId] = (result[lastClosedTxnId]||0) + divNet;
        result[t.id]=0;
      } else {
        result[t.id]=divNet;
      }
    }
  }
  return result;
}

function categoryAgg(holdings, closed){
  closed = closed || [];
  const agg={};
  function ensure(cat){ if(!agg[cat]) agg[cat]={investment:0,value:0,unrealized:0,realized:0}; return agg[cat]; }
  holdings.forEach(h=>{
    const c=ensure(h.categoryId);
    c.investment += h.costBasis;
    c.value += h.value;
    c.unrealized += h.unrealized;
    c.realized += h.realized;
  });
  // Realized profit from positions that were fully closed in the past belongs to the category too —
  // otherwise a category you've completely exited would show none of its historical gains.
  closed.forEach(c=>{ ensure(c.categoryId).realized += c.profit; });
  Object.values(agg).forEach(c=>{
    c.overall = c.unrealized + c.realized;
    c.profit = c.unrealized; // kept for the profit-ladder tab, which plans withdrawals off unrealized gains
    c.profitPct = c.investment>1e-6 ? c.unrealized/c.investment*100 : 0;
  });
  return agg;
}

function totals(holdings, closed){
  const investment=holdings.reduce((s,h)=>s+h.costBasis,0);
  const value=holdings.reduce((s,h)=>s+h.value,0);
  const unrealized=value-investment;
  const realizedOpen=holdings.reduce((s,h)=>s+h.realized,0);
  const realizedClosed=closed.reduce((s,c)=>s+c.profit,0);
  const realized=realizedOpen+realizedClosed;
  return {investment, value, unrealized, realized, overall:unrealized+realized};
}

/* ---------- Dashboard: donut composition chart ---------- */
function renderDonutSVG(segments, size, thickness){
  size=size||168; thickness=thickness||24;
  const r=(size-thickness)/2, c=2*Math.PI*r, cx=size/2, cy=size/2;
  const total=segments.reduce((s,x)=>s+x.value,0);
  let arcs='';
  if(total>1e-6){
    let offset=0;
    segments.forEach((seg,i)=>{
      const frac=Math.max(0,seg.value)/total;
      const dash=frac*c;
      if(dash>1e-6){
        arcs += `<circle class="donut-seg" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${thickness}" stroke-dasharray="${dash} ${c-dash}" stroke-dashoffset="${-offset}" data-seg-idx="${i}" style="cursor:pointer;"></circle>`;
        offset += dash;
      }
    });
  } else {
    arcs = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${thickness}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg); overflow:visible;">${arcs}</svg>`;
}
function buildCompositionSegments(holdings, closed, filterCat){
  function finalize(list){
    return list.map(s=>{
      const overall=s.unrealized+s.realized;
      return {...s,
        overall,
        unrealizedPct: s.investment>1e-6? s.unrealized/s.investment*100:0,
        realizedPct: s.investment>1e-6? s.realized/s.investment*100:0,
        overallPct: s.investment>1e-6? overall/s.investment*100:0,
      };
    });
  }
  if(filterCat==='__all__'){
    const agg=categoryAgg(holdings, closed);
    const totalValue=Object.values(agg).reduce((s,a)=>s+a.value,0);
    const cats=Object.keys(agg).filter(c=>agg[c].value>1e-6).sort((a,b)=>agg[b].value-agg[a].value);
    return finalize(cats.map((c,i)=>({
      label:categoryName(c), value:agg[c].value, investment:agg[c].investment, unrealized:agg[c].unrealized, realized:agg[c].realized,
      pct: totalValue>1e-6? agg[c].value/totalValue*100:0, color:PALETTE[i%PALETTE.length]
    })));
  }
  const inCat=holdings.filter(h=>h.categoryId===filterCat);
  const totalValue=inCat.reduce((s,h)=>s+h.value,0);
  return finalize(inCat.sort((a,b)=>b.value-a.value).map((h,i)=>({
    label:h.name, value:h.value, investment:h.costBasis, unrealized:h.unrealized, realized:h.realized,
    pct: totalValue>1e-6? h.value/totalValue*100:0, color:PALETTE[i%PALETTE.length]
  })));
}
function renderCompositionCard(holdings, closed){
  const allCats=Array.from(new Set(holdings.map(h=>h.categoryId))).sort();
  if(!allCats.includes(dashboardFilter) && dashboardFilter!=='__all__') dashboardFilter='__all__';
  let segments=buildCompositionSegments(holdings, closed, dashboardFilter);
  const totalValue=segments.reduce((s,x)=>s+x.value,0);
  const centerLabel = dashboardFilter==='__all__' ? 'کل پرتفو' : esc(categoryName(dashboardFilter));

  if(compositionSort.key){
    const k=compositionSort.key, dir=compositionSort.dir;
    segments=[...segments].sort((a,b)=>{
      if(k==='label') return dir*String(a.label).localeCompare(String(b.label),'fa');
      return dir*((a[k]||0)-(b[k]||0));
    });
  }

  const rows = segments.map(seg=>`<tr>
    <td><span class="legend-dot" style="background:${seg.color}"></span></td>
    <td>${esc(seg.label)}</td>
    <td class="num">${fmt(seg.investment)}</td>
    <td class="num">${fmt(seg.value)}</td>
    <td class="num ${plClass(seg.unrealized)}">${fmt(seg.unrealized)}<br><span class="muted">${fmtPct(seg.unrealizedPct)}</span></td>
    <td class="num ${plClass(seg.realized)}">${fmt(seg.realized)}<br><span class="muted">${fmtPct(seg.realizedPct)}</span></td>
    <td class="num ${plClass(seg.overall)}">${fmt(seg.overall)}<br><span class="muted">${fmtPct(seg.overallPct)}</span></td>
    <td class="share-cell"><span class="num" style="font-size:13px;">${fmt(seg.pct,1)}٪</span><div class="share-track"><div class="share-fill" style="width:${Math.min(100,Math.max(0,seg.pct))}%; background:${seg.color};"></div></div></td>
  </tr>`).join('');

  // Two select filters (category drill-down + portfolio scope), always side-by-side on one
  // line — this is the ONLY portfolio filter on the dashboard now (a second one used to sit
  // above this card too; that was redundant, so it's gone and this is the single source of truth).
  const filterBar = `<div style="display:flex; gap:8px; align-items:center;">
    <select id="compositionCatFilter" style="flex:1; min-width:0;">
      <option value="__all__" ${dashboardFilter==='__all__'?'selected':''}>همه کتگوری‌ها</option>
      ${allCats.map(c=>`<option value="${esc(c)}" ${dashboardFilter===c?'selected':''}>${esc(categoryName(c))}</option>`).join('')}
    </select>
    ${PORTFOLIOS.length>1?`<select id="compositionPidFilter" style="flex:1; min-width:0;">
      <option value="__all__" ${dashboardPidFilter==='__all__'?'selected':''}>همه سبدها</option>
      ${PORTFOLIOS.map(p=>`<option value="${p.id}" ${p.id===dashboardPidFilter?'selected':''}>${esc(p.name)}</option>`).join('')}
    </select>`:''}
  </div>`;

  function th(label, key, extraStyle){
    const active = compositionSort.key===key;
    const arrow = active ? (compositionSort.dir===1?' ▲':' ▼') : '';
    return `<th class="sortable-th" data-sort-key="${key}" style="cursor:pointer;user-select:none;${extraStyle||''}" title="برای مرتب‌سازی کلیک کنید">${label}${arrow}</th>`;
  }

  return `
    <div class="card">
      <div class="card-head">
        <h3>ترکیب پرتفو</h3>
        ${allCats.length? filterBar : ''}
      </div>
      ${segments.length? `
      <div style="display:flex; gap:28px; flex-wrap:wrap; align-items:center;">
        <div style="position:relative; width:186px; height:186px; flex-shrink:0;" id="donutWrap" data-segments='${JSON.stringify(segments).replace(/'/g,'&#39;')}'>
          ${renderDonutSVG(segments, 186, 25)}
          <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none;">
            <div class="muted" style="font-size:12px;">${centerLabel}</div>
            <div class="num" style="font-size:17px; font-weight:750;">${fmt(totalValue)}</div>
            <div class="muted" style="font-size:11px; margin-top:1px;">تومان</div>
          </div>
        </div>
        <div style="flex:1; min-width:340px;">
          <div class="table-wrap"><table><thead><tr>
            <th></th>${th(dashboardFilter==='__all__'?'کتگوری':'دارایی','label')}${th('سرمایه‌گذاری','investment')}${th('ارزش روز','value')}${th('سود/زیان فعلی','unrealized')}${th('سود/زیان تحقق‌یافته','realized')}${th('سود/زیان کلی','overall')}${th('سهم از پرتفو','pct')}
          </tr></thead><tbody>${rows}</tbody></table></div>
        </div>
      </div>` : `<div class="empty">${dashboardFilter==='__all__'? 'هنوز دارایی فعالی ثبت نشده. از تب «ثبت تراکنش» شروع کنید.' : 'دارایی فعالی در این کتگوری نیست.'}</div>`}
    </div>
    <div id="donutTooltip" class="donut-tooltip hidden"></div>`;
}
// Same segments/filter as the composition card above (category drill-down + portfolio scope
// stay in sync automatically since both read dashboardFilter/dashboardPidFilter) — but shown
// as profit/loss bars instead of value-share, which is information the donut+table don't
// make easy to compare at a glance (who's up, who's down, and by how much relative to the rest).
function renderBarChartCard(holdings, closed){
  const segments=buildCompositionSegments(holdings, closed, dashboardFilter)
    .sort((a,b)=>b.unrealized-a.unrealized);
  if(!segments.length) return '';
  const maxAbs = Math.max(1, ...segments.map(s=>Math.abs(s.unrealized)));
  const title = dashboardFilter==='__all__' ? 'سود/زیان فعلی هر کتگوری' : `سود/زیان فعلی دارایی‌های «${esc(categoryName(dashboardFilter))}»`;

  const rows = segments.map(s=>{

  return `<div class="card" style="margin-top:14px;">

function wireDonutTooltip(){
  const wrap=document.getElementById('donutWrap');
  const tooltip=document.getElementById('donutTooltip');
  if(!wrap||!tooltip) return;
  let segments=[];
  try{ segments=JSON.parse(wrap.dataset.segments||'[]'); }catch(e){ segments=[]; }

  function tooltipHTML(seg){
    return `
      <div class="dt-title"><span class="legend-dot" style="background:${seg.color}"></span>${esc(seg.label)}</div>
      <div class="dt-row"><span>سهم</span><span class="num">${fmt(seg.pct,1)}٪</span></div>
      <div class="dt-row"><span>سرمایه‌گذاری</span><span class="num">${fmt(seg.investment)}</span></div>
      <div class="dt-row"><span>ارزش روز</span><span class="num">${fmt(seg.value)}</span></div>
      <div class="dt-row"><span>سود/زیان فعلی</span><span class="num ${plClass(seg.unrealized)}">${fmt(seg.unrealized)} (${fmtPct(seg.unrealizedPct)})</span></div>
      <div class="dt-row"><span>سود/زیان تحقق‌یافته</span><span class="num ${plClass(seg.realized)}">${fmt(seg.realized)} (${fmtPct(seg.realizedPct)})</span></div>
      <div class="dt-row"><span>سود/زیان کلی</span><span class="num ${plClass(seg.overall)}">${fmt(seg.overall)} (${fmtPct(seg.overallPct)})</span></div>
    `;
  }
  function positionTip(evt){
    const pad=16, tw=220, th=190;
    let x=evt.clientX+pad, y=evt.clientY+pad;
    if(x+tw>window.innerWidth) x=evt.clientX-tw-pad;
    if(y+th>window.innerHeight) y=evt.clientY-th-pad;
    tooltip.style.left=Math.max(4,x)+'px';
    tooltip.style.top=Math.max(4,y)+'px';
  }
  function showTip(idx, evt){
    const seg=segments[idx]; if(!seg) return;
    tooltip.innerHTML=tooltipHTML(seg);
    tooltip.classList.remove('hidden');
    positionTip(evt);
  }
  function hideTip(){ tooltip.classList.add('hidden'); }

  wrap.querySelectorAll('[data-seg-idx]').forEach(el=>{
    const idx=parseInt(el.dataset.segIdx);
    el.addEventListener('mouseenter', e=>showTip(idx,e));
    el.addEventListener('mousemove', positionTip);
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('click', e=>{ e.stopPropagation(); showTip(idx,e); });
  });
  document.addEventListener('click', hideTip);
}

// Missing-price and ladder-readiness alerts are always computed per portfolio (ladders are
// independent per portfolio, per الهه's design decision) and only concatenated afterward for
// display — in the combined "همه سبدها" view this is a display aggregation, never a merged
// calculation, so a threshold from one portfolio is never checked against another's profit.
// Pass a portfolio id (and not '__all__') to scope alerts to just that one portfolio — used
// by the Dashboard tab's local filter; defaults to every portfolio combined.
function computeDashboardAlerts(pid){
  const scoped = pid && pid!=='__all__';
  const missingPrice=[], readyToSecure=[];
  const targetPortfolios = scoped ? PORTFOLIOS.filter(p=>p.id===pid) : PORTFOLIOS;
  targetPortfolios.forEach(p=>{
    const pid=p.id;
    const {holdings}=computeHoldingsForPortfolio(pid);
    holdings.forEach(h=>{
      // Prices are shared across portfolios, so dedupe by asset name — no need to flag the
      // same un-priced asset twice just because two portfolios happen to hold it.
      if(!h.hasPrice && !missingPrice.some(x=>x.name===h.name)) missingPrice.push(h);
    });
    const agg = categoryAgg(holdings);
    const levelsMap = ensurePortfolioLadders(pid);
    Object.keys(agg).forEach(cat=>{
      const a=agg[cat];
      if(a.investment<=1e-6) return;
      const levels = levelsMap[cat] || DEFAULT_LADDERS['سایر'];
      levels.forEach((lv,idx)=>{
        if(a.profitPct < lv.t) return;
        const secured = WITHDRAWALS.some(w=>w.portfolioId===pid && w.categoryId===cat && w.level===idx);
        if(!secured) readyToSecure.push({cat, idx, t:lv.t, portfolioId:pid, portfolioName:portfolioName(pid)});
      });
    });
  });
  return {missingPrice, readyToSecure};
}

      </div>
      <button class="btn btn-xs" data-goto="ladders">مشاهده پله‌های سود</button>

  return `<div class="card alert-card">

function computeConcentration(holdings){
  const totalValue = holdings.reduce((s,h)=>s+h.value,0);
  if(totalValue<=1e-6 || !holdings.length) return null;
  const top=[...holdings].sort((a,b)=>b.value-a.value)[0];
  return {name:top.name, pct: top.value/totalValue*100, value: top.value};
}
// Sums same-date snapshots across every portfolio into a display-only combined row (a real
// snapshot is still saved per portfolio at save-time — see onSaveSnapshot — never a fabricated
// combined one). Pass a portfolio id (and not '__all__') to narrow the sum to just that one
// portfolio's own snapshots — used by the Trend tab's local filter.
function snapshotsForView(pid){
  const source = (pid && pid!=='__all__') ? SNAPSHOTS.filter(s=>s.portfolioId===pid) : SNAPSHOTS;
  const byDate={};
  source.forEach(s=>{
    if(!byDate[s.date]) byDate[s.date]={id:'agg-'+s.date, date:s.date, investment:0, value:0, unrealized:0, realized:0, overall:0, byCategory:{}};
    const d=byDate[s.date];
    d.investment+=s.investment; d.value+=s.value; d.unrealized+=s.unrealized; d.realized+=s.realized; d.overall+=s.overall;
    Object.keys(s.byCategory||{}).forEach(c=>{
      if(!d.byCategory[c]) d.byCategory[c]={investment:0,value:0};
      d.byCategory[c].investment += s.byCategory[c].investment;
      d.byCategory[c].value += s.byCategory[c].value;
    });
  });
  return Object.values(byDate).sort((a,b)=>jalaliSortKey(a.date)-jalaliSortKey(b.date));
}
function renderMiniTrendCard(pid){
  const data0=snapshotsForView(pid);
  if(!data0.length){
    return `<div class="card" style="margin-top:14px;">
      <div class="card-head"><h3>روند ارزش پرتفو</h3><button class="btn btn-xs" data-goto="trend">مشاهده کامل</button></div>
      <div class="empty">هنوز گزارشی ثبت نشده. از تب «پرتفوی» با دکمه «ذخیره قیمت‌های روز و ثبت گزارش» یک نقطه ثبت کنید.</div>
    </div>`;
  }
  const data=data0;
  const series=data.map(d=>d.value);
  const W=680,H=70,pad=6;
  const rawMin=Math.min(...series), rawMax=Math.max(...series);
  let min,max;
  if(rawMin===rawMax){ const pd=Math.max(Math.abs(rawMin)*0.1,1); min=rawMin-pd; max=rawMax+pd; }
  else { const pd=(rawMax-rawMin)*0.12; min=rawMin-pd; max=rawMax+pd; }
  const xStep = data.length>1? (W-pad*2)/(data.length-1) : 0;
  function xAt(i){ return data.length>1? pad+i*xStep : W/2; }
  function yAt(v){ return pad + (H-pad*2) - (v-min)/(max-min)*(H-pad*2); }
  const pts=series.map((v,i)=>({x:xAt(i), y:yAt(v)}));
  // منحنی نرم (Catmull-Rom → Bezier) به‌جای خط شکسته — نمای مدرن‌تر بدون تغییر داده‌ها.
  let path='';
  if(pts.length===1){ path=`M${pts[0].x},${pts[0].y}`; }
  else {
    path=`M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
      const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
      const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
      path+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
    }
  }
  const lastX=pts[pts.length-1].x, lastY=pts[pts.length-1].y;
  const areaPath = `${path} L${lastX},${H-pad} L${pts[0].x},${H-pad} Z`;
  const first=data[0], last=data[data.length-1];
  const changePct = Math.abs(first.value)>1e-6 ? (last.value-first.value)/Math.abs(first.value)*100 : 0;
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%; height:auto; overflow:visible;">
    <defs>
      <linearGradient id="miniTrendFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--gold)" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaPath}" fill="url(#miniTrendFill)"/>
    <path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="${lastX}" cy="${lastY}" r="6.5" fill="var(--gold)" opacity="0.18"/>
    <circle cx="${lastX}" cy="${lastY}" r="3.5" fill="var(--gold)" stroke="var(--bg)" stroke-width="1.5"/>
  </svg>`;
  return `<div class="card" style="margin-top:14px;">
    <div class="card-head">
      <h3>روند ارزش پرتفو</h3>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="delta-chip ${changePct>1e-9?'pos':(changePct<-1e-9?'neg':'flat')}">${fmtPct(changePct)} در این بازه</span>
        <button class="btn btn-xs" data-goto="trend">مشاهده کامل</button>
      </div>
    </div>
    ${svg}
    <div class="stat-mini" style="margin-top:8px;">
      <span class="muted">از <span class="num">${first.date}</span> تا <span class="num">${last.date}</span> · ${data.length} گزارش</span>
      <span>ارزش روز فعلی: <b class="num">${fmt(last.value)}</b></span>
    </div>
  </div>`;
}

function wirePortfolioSelectInAddTab(){
  const sel=document.getElementById('addTabPortfolioSelect');
  if(sel) sel.addEventListener('change', ()=>{ addTabPortfolioId=sel.value; renderAddTab(); });
}

function bindAddForm(){
  const typeEl=document.getElementById('f_type');
  const qtyRow=document.getElementById('qtyPriceRow');
  const amountLabel=document.getElementById('amountLabel');
  const qtyEl=document.getElementById('f_qty'), priceEl=document.getElementById('f_price'), amountEl=document.getElementById('f_amount');
  const assetEl=document.getElementById('f_asset'), catEl=document.getElementById('f_category'), locEl=document.getElementById('f_location');
  const portfolioSelEl=document.getElementById('f_portfolio');
  if(portfolioSelEl && portfolioSelEl.tagName==='SELECT'){
    portfolioSelEl.addEventListener('change', ()=>{
      addTabPortfolioId=portfolioSelEl.value;
      editingTxnId=null; // switching the target portfolio mid-edit doesn't carry the edit over
      renderAddTab();
    });
  }

  function syncTypeUI(){
    if(typeEl.value==='dividend'){ qtyRow.classList.add('hidden'); amountLabel.textContent='مبلغ سود نقدی (تومان)'; }
    else { qtyRow.classList.remove('hidden'); amountLabel.textContent= typeEl.value==='buy' ? 'مبلغ کل خرید (تومان)' : 'مبلغ کل فروش (تومان)'; }
  }
  typeEl.addEventListener('change', syncTypeUI);
  syncTypeUI();

  function recalcAmount(){ amountEl.value = num(qtyEl.value)*num(priceEl.value) ? fmt(num(qtyEl.value)*num(priceEl.value)) : ''; }
  qtyEl.addEventListener('input', recalcAmount);
  priceEl.addEventListener('input', recalcAmount);

  assetEl.addEventListener('change', ()=>{
    const info=lastInfoForAsset(assetEl.value.trim());
    if(info){ if(info.categoryId) catEl.value=info.categoryId; if(!locEl.value) locEl.value=info.location||''; }
  });

  document.getElementById('btnCancelEdit').addEventListener('click', ()=>{ editingTxnId=null; renderAddTab(); });

  document.getElementById('txnForm').addEventListener('submit', async e=>{
    e.preventDefault();
    if(!requireAdmin('ثبت یا ویرایش تراکنش')) return;
    const type=typeEl.value;
    const date=normalizeJalali(document.getElementById('f_date').value);
    const asset=assetEl.value.trim();
    const categoryId=catEl.value;
    const qty= type==='dividend'?0:num(qtyEl.value);
    const price= type==='dividend'?0:num(priceEl.value);
    const amount=num(amountEl.value);
    const fee=Math.max(0, num(document.getElementById('f_fee').value));
    const accountId=document.getElementById('f_account').value || null;
    const location=locEl.value.trim();
    const note=document.getElementById('f_note').value.trim();
    const portfolioId=document.getElementById('f_portfolio').value;

    if(!portfolioId){ toast('سبد را انتخاب کنید.',true); return; }
    if(!date){ toast('فرمت تاریخ درست نیست یا وجود ندارد. مثل 1405/04/01 وارد کنید.',true); return; }
    if(!asset){ toast('نام دارایی را وارد کنید.',true); return; }
    if(!categoryId){ toast('کتگوری را انتخاب کنید.',true); return; }
    if(type!=='dividend' && qty<=0){ toast('تعداد باید بزرگتر از صفر باشد.',true); return; }
    if(amount<=0){ toast('مبلغ باید بزرگتر از صفر باشد.',true); return; }
    if(type==='sell' && fee>=amount){ toast('کارمزد نمی‌تواند برابر یا بیشتر از مبلغ فروش باشد.',true); return; }

    if(type==='sell'){
      const available=currentQtyForAsset(asset, editingTxnId, portfolioId);
      if(available<=1e-9){
        toast(`موجودی فعلی «${asset}» در این سبد صفر است؛ فروشی برای ثبت وجود ندارد. اگر اسم دارایی را درست وارد کرده‌اید، ابتدا خرید آن را ثبت کنید.`,true);
        return;
      }
      if(qty > available + 1e-6){
        toast(`مقدار فروش (${fmt(qty,4)}) از موجودی فعلی «${asset}» در این سبد (${fmt(available,4)}) بیشتر است.`,true);
        return;
      }
    }
    if(type==='dividend'){
      if(!assetHasAnyHistory(asset, editingTxnId, portfolioId)){
        toast(`دارایی «${asset}» هیچ سابقه‌ای در این سبد ندارد. سود نقدی فقط برای دارایی‌ای که قبلاً خرید آن در همین سبد ثبت شده قابل ثبت است.`,true);
        return;
      }
    }

    const payload={type,date,asset,categoryId,accountId,qty,price,amount,fee,location,note};
    try{
      if(editingTxnId){
        const updated = await apiSave(`/transactions/${editingTxnId}`, {method:'PUT', body:payload});
        const t=TXNS.find(x=>x.id===editingTxnId);
        Object.assign(t, {type:updated.type,date:updated.date,asset:updated.asset,categoryId:updated.categoryId,accountId:updated.accountId,qty:updated.qty,price:updated.price,amount:updated.amount,fee:updated.fee,location:updated.location,note:updated.note});
        editingTxnId=null;
        toast('تراکنش ویرایش شد.');
      } else {
        const created = await apiSave(`/portfolios/${portfolioId}/transactions`, {method:'POST', body:payload});
        TXNS.push({id:created.id, ts:created.ts, type:created.type, date:created.date, asset:created.asset, categoryId:created.categoryId, accountId:created.accountId, qty:created.qty, price:created.price, amount:created.amount, fee:created.fee, location:created.location, note:created.note, portfolioId:created.portfolioId});
        toast('تراکنش ثبت شد.');
      }
      await refreshAccounts(); // fee/account may have changed this account's balance
      renderAll();
    }catch(err){ toast(err.message, true); }
  });
}
async function refreshAccounts(){
  ACCOUNTS = await safeLoad(()=>apiFetch('/accounts'), ACCOUNTS);
}

// Always scoped to the portfolio the «ثبت تراکنش» tab is currently showing — this log sits
// directly under that portfolio's summary card, so mixing in other portfolios' rows here
// would make the numbers above it impossible to reconcile.
function renderTxnLog(filter){
  filter=(filter||'').trim().toLowerCase();
  const list=[...txnsForPortfolio(addTabPortfolioId)].sort((a,b)=>jalaliSortKey(b.date)-jalaliSortKey(a.date)||(b.ts-a.ts))
    .filter(t=> !filter || t.asset.toLowerCase().includes(filter) || categoryName(t.categoryId).toLowerCase().includes(filter) || (t.note||'').toLowerCase().includes(filter));
  const wrap=document.getElementById('txnLogWrap');
  if(!list.length){ wrap.innerHTML=`<div class="empty">تراکنشی پیدا نشد.</div>`; return; }
  const admin=isAdmin();
  wrap.innerHTML = `<div class="table-wrap"><table><thead><tr>
    <th>تاریخ</th><th>نوع</th><th>دارایی</th><th>کتگوری</th><th>تعداد</th><th>قیمت واحد</th><th>مبلغ</th><th>کارمزد</th><th>حساب</th><th>محل</th>${admin?'<th>عملیات</th>':''}
  </tr></thead><tbody>
  ${list.map(t=>`<tr>
    <td class="num">${t.date}</td>
    <td>${typeBadge(t.type)}</td>
    <td>${esc(t.asset)}</td>
    <td><span class="badge badge-cat">${esc(categoryName(t.categoryId))}</span></td>
    <td class="num">${t.type==='dividend'?'—':fmt(t.qty,4)}</td>
    <td class="num">${t.type==='dividend'?'—':fmt(t.price)}</td>
    <td class="num">${fmt(t.amount)}</td>
    <td class="num">${t.fee?fmt(t.fee):'—'}</td>
    <td>${t.accountId?esc(accountName(t.accountId)):'—'}</td>
    <td>${esc(t.location||'—')}</td>
    ${admin?`<td><div class="row-actions">
      <button class="btn btn-xs" data-edit-txn="${t.id}">ویرایش</button>
      <button class="btn btn-xs btn-danger" data-del-txn="${t.id}">حذف</button>
    </div></td>`:''}
  </tr>`).join('')}
  </tbody></table></div>`;
}

function editTxn(id){
  if(!requireAdmin('ویرایش تراکنش')) return;
  const t=TXNS.find(x=>x.id===id); if(!t) return;
  editingTxnId=id;
  addTabPortfolioId=t.portfolioId; // make sure the tab is showing this txn's own portfolio
  renderAddTab();
  document.getElementById('formTitle').textContent='ویرایش تراکنش';
  document.getElementById('btnCancelEdit').classList.remove('hidden');
  document.getElementById('btnSubmitTxn').textContent='ذخیره تغییرات';
  const pfEl=document.getElementById('f_portfolio');
  if(pfEl) pfEl.value=t.portfolioId;
  document.getElementById('f_type').value=t.type;
  document.getElementById('f_type').dispatchEvent(new Event('change'));
  document.getElementById('f_date').value=t.date;
  document.getElementById('f_asset').value=t.asset;
  document.getElementById('f_category').value=t.categoryId;
  document.getElementById('f_qty').value= t.qty? fmt(t.qty,4):'';
  document.getElementById('f_price').value= t.price? fmt(t.price):'';
  document.getElementById('f_amount').value= fmt(t.amount);
  document.getElementById('f_fee').value= t.fee? fmt(t.fee):'';
  document.getElementById('f_account').value= t.accountId||'';
  document.getElementById('f_location').value=t.location||'';
  document.getElementById('f_note').value=t.note||'';
  document.getElementById('txnForm').scrollIntoView({behavior:'smooth',block:'start'});
}
async function deleteTxn(id){
  if(!requireAdmin('حذف تراکنش')) return;
  const linkedWd = WITHDRAWALS.filter(w=>w.sourceTxnId===id);
  const confirmMsg = linkedWd.length
    ? 'این تراکنش حذف شود؟ این فروش به یک «سیو سود» در تب پله‌های سود متصل است — با حذف تراکنش، آن برداشت هم حذف می‌شود و پله دوباره «سیو‌نشده» علامت می‌خورد. این عمل قابل بازگشت نیست.'
    : 'این تراکنش حذف شود؟ این عمل قابل بازگشت نیست.';
  if(!confirm(confirmMsg)) return;
  try{
    await apiSave(`/transactions/${id}`, {method:'DELETE'});
    TXNS=TXNS.filter(t=>t.id!==id);
    if(linkedWd.length) WITHDRAWALS=WITHDRAWALS.filter(w=>w.sourceTxnId!==id);
    renderAll();
    toast(linkedWd.length ? 'تراکنش حذف شد و سیو سود مرتبط با آن هم لغو شد.' : 'تراکنش حذف شد.');
  }catch(err){ toast(err.message, true); }
}

/* ---------- Holdings tab ---------- */
function renderAssetDetail(name, pid){
  const txns=TXNS.filter(t=>t.asset===name && t.portfolioId===pid).sort((a,b)=>jalaliSortKey(b.date)-jalaliSortKey(a.date)||(b.ts-a.ts));
  if(!txns.length) return `<div class="empty">تراکنشی برای این دارایی ثبت نشده.</div>`;
  const realizedByTxn = computeAssetTxnRealized(name, pid);
  return `<div class="table-wrap"><table><thead><tr>
      <th>تاریخ</th><th>نوع</th><th>تعداد</th><th>قیمت واحد</th><th>مبلغ</th><th>سود/زیان تحقق‌یافته این تراکنش</th><th>محل</th><th>توضیحات</th>
    </tr></thead><tbody>
      ${txns.map(t=>{
        const r = realizedByTxn[t.id];
        const realizedCell = (t.type==='buy' || r===undefined) ? '<span class="muted">—</span>' : `<span class="${plClass(r)}">${fmt(r)}</span>`;
        return `<tr>
        <td class="num">${t.date}</td>
        <td>${typeBadge(t.type)}</td>
        <td class="num">${t.type==='dividend'?'—':fmt(t.qty,4)}</td>
        <td class="num">${t.type==='dividend'?'—':fmt(t.price)}</td>
        <td class="num">${fmt(t.amount)}</td>
        <td class="num">${realizedCell}</td>
        <td>${esc(t.location||'—')}</td>
        <td>${esc(t.note||'—')}</td>
      </tr>`;}).join('')}
    </tbody></table></div>`;
}
function renderHoldings(){
  if(!holdingsFilterPid || (holdingsFilterPid!=='__all__' && !PORTFOLIOS.some(p=>p.id===holdingsFilterPid))) holdingsFilterPid='__all__';
  if(holdingsAsOfDate){ const norm=normalizeJalali(holdingsAsOfDate); holdingsAsOfDate = norm || null; }
  const {holdings}=currentHoldingsView(holdingsFilterPid, holdingsAsOfDate);
  const showPortfolioCol = PORTFOLIOS.length>1 && holdingsFilterPid==='__all__';
  const colCount = showPortfolioCol?13:12;
  let rows='', footer='';
  if(!holdings.length){
    rows=`<tr><td colspan="${colCount}"><div class="empty">${holdingsAsOfDate? 'در این تاریخ هنوز دارایی‌ای در این نما وجود نداشته.' : 'هنوز دارایی فعالی نیست.'} <b>از تب «ثبت تراکنش» یک خرید ثبت کنید.</b></div></td></tr>`;
  } else {
    const totalValue=holdings.reduce((s,h)=>s+h.value,0);
    rows = holdings.map(h=>{
      const portfolioPct = totalValue>1e-6? h.value/totalValue*100:0;
      // Composite key: the same asset name can appear once per portfolio in the combined view,
      // so the name alone isn't a unique row identity for expand/collapse state.
      const rowKey = h.portfolioId+'|'+h.name;
      const isOpen=expandedHoldings.has(rowKey);
      const mainRow = `<tr data-asset-row="${esc(rowKey)}">
        <td><button type="button" class="expand-toggle ${isOpen?'open':''}" data-toggle-holding="${esc(rowKey)}" title="نمایش تراکنش‌های این دارایی"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></td>
        <td>${esc(h.name)}</td>
        <td><span class="badge badge-cat">${esc(categoryName(h.categoryId))}</span></td>
        ${showPortfolioCol?`<td><span class="badge badge-cat">${esc(h.portfolioName)}</span></td>`:''}
        <td class="num">${fmt(h.qty,4)}</td>
        <td class="num">${fmt(h.avgCost)}</td>
        <td class="num">${fmt(h.costBasis)}</td>
        <td>
          <input class="num price-input" data-price-asset="${esc(h.name)}" type="text" inputmode="decimal" value="${h.price?fmt(h.price):''}" placeholder="وارد نشده" style="width:110px;" ${isAdmin()?'':'readonly'}>
          ${PRICES_UPDATED_AT[h.name] ? `<div class="muted" style="font-size:11.5px; margin-top:2px;" title="تاریخی که این قیمت آخرین‌بار وارد/ویرایش شده">بروزرسانی: ${esc(PRICES_UPDATED_AT[h.name])}</div>` : ''}
        </td>
        <td class="num">${fmt(h.value)}${h.hasPrice?'':' <span class="muted" title="قیمت روز هنوز وارد نشده؛ فعلاً برابر مبلغ خرید در نظر گرفته شده">•</span>'}</td>
        <td class="num ${plClass(h.unrealized)}">${h.hasPrice? fmt(h.unrealized)+'<br><span class="muted">'+fmtPct(h.unrealizedPct)+'</span>' : '<span class="muted">قیمت روز وارد نشده</span>'}</td>
        <td class="num ${plClass(h.realized)}">${fmt(h.realized)}</td>
        <td class="num ${plClass(h.totalPL)}">${fmt(h.totalPL)}</td>
        <td class="num">${fmt(portfolioPct,2)}٪</td>
      </tr>`;
      const detailRow = isOpen ? `<tr class="asset-detail-row"><td colspan="${colCount}"><div class="asset-detail-wrap">${renderAssetDetail(h.name, h.portfolioId)}</div></td></tr>` : '';
      return mainRow+detailRow;
    }).join('');
    // Footer totals — only for columns where summing across different assets is meaningful.
    // تعداد/میانگین خرید/قیمت روز are per-unit or per-asset figures in different units, so they're
    // left blank rather than summed into a meaningless number.
    const totalCostBasis=holdings.reduce((s,h)=>s+h.costBasis,0);
    const totalUnrealized=holdings.reduce((s,h)=>s+h.unrealized,0);
    const totalRealized=holdings.reduce((s,h)=>s+h.realized,0);
    const totalPL=holdings.reduce((s,h)=>s+h.totalPL,0);
    const totalPct=totalValue>1e-6?100:0;
    footer = `<tfoot><tr>
      <td></td><td><b>جمع</b></td><td></td>${showPortfolioCol?'<td></td>':''}<td></td><td></td>
      <td class="num"><b>${fmt(totalCostBasis)}</b></td>
      <td></td>
      <td class="num"><b>${fmt(totalValue)}</b></td>
      <td class="num ${plClass(totalUnrealized)}"><b>${fmt(totalUnrealized)}</b></td>
      <td class="num ${plClass(totalRealized)}"><b>${fmt(totalRealized)}</b></td>
      <td class="num ${plClass(totalPL)}"><b>${fmt(totalPL)}</b></td>
      <td class="num"><b>${fmt(totalPct,2)}٪</b></td>
    </tr></tfoot>`;
  }
  document.getElementById('tab-holdings').innerHTML = `
    <div class="card">

        await apiSave(`/prices/${encodeURIComponent(name)}`, {method:'PUT', body:{price, updatedAt}});

    });

      renderHoldings();
    });
  });
}

async function onSaveSnapshot(){
  if(!requireAdmin('ثبت گزارش روز')) return;
  const dateStr = prompt('تاریخ این گزارش (برای ثبت در نمودار روند):', todayJalali());
  if(dateStr===null) return;
  const date = normalizeJalali(dateStr) || todayJalali();
  // Day prices are already persisted individually as each price input changes (see the
  // [data-price-asset] handler above), so there's nothing extra to save here — the server
  // computes each portfolio's totals itself, straight from current transactions + prices.
  try{
    for(const p of PORTFOLIOS){
      const snap = await apiSave(`/portfolios/${p.id}/snapshots`, {method:'POST', body:{date}});
      SNAPSHOTS = SNAPSHOTS.filter(s=>!(s.date===date && s.portfolioId===p.id));
      SNAPSHOTS.push(snap);
    }
    SNAPSHOTS.sort((a,b)=>jalaliSortKey(a.date)-jalaliSortKey(b.date));
    toast(`گزارش روز برای ${PORTFOLIOS.length} سبد ذخیره شد و در «روند عملکرد» قابل مشاهده است.`);
    renderTrend();
    renderDashboard();
  }catch(err){ toast(err.message, true); }
}
