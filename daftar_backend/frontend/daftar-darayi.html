/* ---------- Trend tab ---------- */
function niceStep(rough){
  if(!(rough>0)) return 1;
  const exp=Math.floor(Math.log10(rough));
  const base=Math.pow(10,exp);
  const f=rough/base;
  let nf;
  if(f<=1) nf=1; else if(f<=2) nf=2; else if(f<=5) nf=5; else nf=10;
  return nf*base;
}
// Backdrop chip behind an axis label — unlike a thin stroke halo, this stays legible
// no matter what sits behind it (a bright bar fill included), matching how axis labels
// are commonly kept readable over dense marks.
function axisLabelChip(x,y,text,anchor){
  const charW=6.3, padX=4;
  const w = String(text).length*charW + padX*2;
  const rectX = anchor==='end' ? x-w : anchor==='middle' ? x-w/2 : x;
  return `<g pointer-events="none"><rect x="${rectX}" y="${y-9.5}" width="${w}" height="13" rx="3" fill="var(--surface)"/><text x="${x}" y="${y+2.5}" font-size="11.5" fill="var(--ink-faint)" text-anchor="${anchor}">${text}</text></g>`;
}
function roundedBarPath(x,yTop,w,h,r,roundAtTop){
  r=Math.max(0,Math.min(r,w/2,h));
  if(h<=0) return '';
  if(r<=0.1){
    return `M${x},${yTop} h${w} v${h} h${-w} Z`;
  }
  if(roundAtTop){
    return `M${x},${yTop+h} L${x},${yTop+r} Q${x},${yTop} ${x+r},${yTop} L${x+w-r},${yTop} Q${x+w},${yTop} ${x+w},${yTop+r} L${x+w},${yTop+h} Z`;
  }
  return `M${x},${yTop} L${x+w},${yTop} L${x+w},${yTop+h-r} Q${x+w},${yTop+h} ${x+w-r},${yTop+h} L${x+r},${yTop+h} Q${x},${yTop+h} ${x},${yTop+h-r} Z`;
}
function renderTrend(){
  const wrap=document.getElementById('tab-trend');
  if(!trendFilterPid || (trendFilterPid!=='__all__' && !PORTFOLIOS.some(p=>p.id===trendFilterPid))) trendFilterPid='__all__';
  const data=snapshotsForView(trendFilterPid);
  if(!data.length){
    wrap.innerHTML = `<div class="card"><div class="card-head"><h3>روند عملکرد</h3>${portfolioFilterSelect('trendPortfolioFilterEmpty', trendFilterPid)}</div><div class="empty">هنوز گزارشی ثبت نشده. این نمودار روند «ارزش روز کل» یا «سود/زیان کلی» پرتفو را در طول زمان نشان می‌دهد. برای شروع، از تب «پرتفوی» قیمت‌های روز را وارد کنید و دکمه «ذخیره قیمت‌های روز و ثبت گزارش» را بزنید — هر بار که این کار را بکنید، یک نقطه جدید به این نمودار اضافه می‌شود.</div></div>`;
    const emptyFilterSel=document.getElementById('trendPortfolioFilterEmpty');
    if(emptyFilterSel) emptyFilterSel.addEventListener('change', ()=>{ trendFilterPid=emptyFilterSel.value; renderTrend(); });
    return;
  }
  const W=720,H=260,padL=80,padR=14,padT=16,padB=34;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const modeLabel = trendMode==='value' ? 'ارزش روز کل' : 'سود/زیان کلی';
  const series = trendMode==='value' ? data.map(d=>d.value) : data.map(d=>d.overall);
  const rawMin=Math.min(...series), rawMax=Math.max(...series);

  let min, max, gridTicks;
  if(trendChartType==='bar'){
    // Bar length only reads honestly from a real zero baseline (never a zoomed-in min) —
    // otherwise a small difference in value looks like a huge difference in bar height.
    const posMax=Math.max(0,rawMax), negMax=Math.max(0,-rawMin);
    const step=niceStep(Math.max(posMax,negMax)/3 || 1);
    max = posMax>0 ? Math.ceil(posMax/step)*step : 0;
    min = negMax>0 ? -Math.ceil(negMax/step)*step : 0;
    if(min===max){ max=step; }
    gridTicks=[];
    for(let v=0; v<=max+1e-9; v+=step) gridTicks.push(v);
    for(let v=-step; v>=min-1e-9; v-=step) gridTicks.push(v);
    gridTicks.sort((a,b)=>a-b);
  } else {
    // Lines are allowed to zoom into the data's own range — the shape/slope is what
    // carries the story here, not an absolute bar length.
    if(rawMin===rawMax){
      const pad=Math.max(Math.abs(rawMin)*0.15, 1);
      min=rawMin-pad; max=rawMax+pad;
    } else {
      const pad=(rawMax-rawMin)*0.15;
      min=rawMin-pad; max=rawMax+pad;
    }
    gridTicks=[max,(min+max)/2,min];
  }
  const showZero = min<0 && max>0; // only draw a break-even baseline when 0 actually falls inside the visible range

  const xStep = data.length>1 ? plotW/(data.length-1) : 0;
  function xAt(i){ return data.length>1 ? padL + i*xStep : padL + plotW/2; }
  function yAt(v){ return padT + plotH - (v-min)/(max-min)*plotH; }

  let dataMarkup;
  if(trendChartType==='bar'){
    // Bars read more clearly for discrete snapshots, and for P&L they naturally split into
    // green (profit) / red (loss) around the baseline instead of relying on a line crossing zero.
    const barW = data.length>1 ? Math.max(4, Math.min(24, xStep*0.5-3)) : 24;
    const baselineY = yAt(0);
    let bars='';
    series.forEach((v,i)=>{
      const x=xAt(i), y=yAt(v);
      const top=Math.min(y,baselineY), h=Math.max(Math.abs(baselineY-y),1);
      const barColor = trendMode==='overall' ? (v>=0?'var(--green)':'var(--red)') : 'var(--gold)';
      const roundAtTop = y<=baselineY;
      bars += `<path d="${roundedBarPath(x-barW/2,top,barW,h,4,roundAtTop)}" fill="${barColor}"/>`;
      // Full plot-height, invisible hit target per column — a short bar is otherwise hard to hover precisely.
      bars += `<rect class="trend-dot" data-pt-idx="${i}" x="${x-Math.max(barW,16)/2}" y="${padT}" width="${Math.max(barW,16)}" height="${plotH}" fill="transparent" style="cursor:pointer;"/>`;
    });
    dataMarkup = bars;
  } else {
    let path='', dots='';
    series.forEach((v,i)=>{
      const x=xAt(i), y=yAt(v);
      path += (i===0?`M${x},${y}`:` L${x},${y}`);
      dots += `<circle class="trend-dot" data-pt-idx="${i}" cx="${x}" cy="${y}" r="4.2" fill="var(--gold)" stroke="var(--bg)" stroke-width="1.5" style="cursor:pointer;"/>`;
    });
    dataMarkup = `<path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.2"/>${dots}`;
  }

  const labelEvery = Math.max(1, Math.ceil(data.length/6));
  let xlabels='';
  data.forEach((d,i)=>{ if(i%labelEvery===0 || i===data.length-1) xlabels += axisLabelChip(xAt(i), H-10, d.date, 'middle'); });

  // The first column (bar or dot) sits flush at x=padL and a bar can extend up to
  // barW/2 to its left, so the y-axis label chip needs more clearance than a bare
  // gap would give it — otherwise the chip's edge lands a couple px inside the bar's
  // silhouette. 18px covers the max bar half-width (12px) plus breathing room.
  const yLabelGap = 18;
  let gridLines='', gridLabels='';
  gridTicks.forEach(v=>{
    if(Math.abs(v)<1e-9 && showZero) return; // the zero tick is drawn separately, bolder
    const y=yAt(v);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border-soft)" stroke-width="1"/>`;
    gridLabels += axisLabelChip(padL-yLabelGap, y, fmt(v), 'end');
  });
  const zeroLine = showZero ? `<line x1="${padL}" y1="${yAt(0)}" x2="${W-padR}" y2="${yAt(0)}" stroke="var(--ink-dim)" stroke-width="1.4"/>` : '';
  // fmt(0), not a hardcoded Persian digit — keep all ticks consistent with the Western
  // digits every other tick uses via fmt().
  const zeroLabel = showZero ? axisLabelChip(padL-yLabelGap, yAt(0), fmt(0), 'end') : '';

  // Draw order: reference lines behind the data, then the data itself, then ALL text labels
  // on top last (each with its own solid backdrop chip) so a bar/line can never obscure a label.
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%; height:auto; font-family:'Vazirmatn',Tahoma,sans-serif; overflow:visible;">
    ${gridLines}
    ${zeroLine}
    ${dataMarkup}
    ${gridLabels}
    ${zeroLabel}
    ${xlabels}
  </svg>`;

  const last=data[data.length-1];
  wrap.innerHTML = `
    <div class="card">
      <div class="card-head"><h3>روند ${esc(modeLabel)} ${trendFilterPid==='__all__'?'پرتفو':'سبد «'+esc(portfolioName(trendFilterPid))+'»'} در طول زمان</h3>${portfolioFilterSelect('trendPortfolioFilter', trendFilterPid)}</div>
      <p class="small-note">این نمودار بر اساس گزارش‌های ذخیره‌شده از تب «پرتفوی» رسم می‌شود؛ هر نقطه یک گزارش است. برای دیدن جزئیات هر نقطه روی آن نگه دارید.${data.length<3?' برای مشاهده یک روند واقعی، در بازه‌های زمانی مختلف چند گزارش دیگر هم ثبت کنید.':''}</p>
      <div class="chart-toggle" style="justify-content:space-between; display:flex; flex-wrap:wrap; gap:8px;">
        <div style="display:flex; gap:6px;">
          <button class="btn btn-xs ${trendMode==='value'?'active':''}" data-trend-mode="value">ارزش روز کل</button>
          <button class="btn btn-xs ${trendMode==='overall'?'active':''}" data-trend-mode="overall">سود/زیان کلی</button>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-xs ${trendChartType==='line'?'active':''}" data-trend-chart="line">📈 خطی</button>
          <button class="btn btn-xs ${trendChartType==='bar'?'active':''}" data-trend-chart="bar">📊 میله‌ای</button>
        </div>
      </div>
      <div style="position:relative;">${svg}</div>
      <div id="trendTooltip" class="donut-tooltip hidden"></div>
      <div class="stat-mini" style="margin-top:10px;">
        <span>آخرین ثبت: <b class="num">${last.date}</b></span>
        <span>ارزش روز: <b class="num">${fmt(last.value)}</b></span>
        <span>سود/زیان کلی: <b class="num ${plClass(last.overall)}">${fmt(last.overall)}</b></span>
      </div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="card-head"><h3>تاریخچه گزارش‌ها</h3></div>
      <p class="small-note">${trendFilterPid==='__all__' ? 'این جدول مجموع گزارش‌های همه سبدها در هر تاریخ است. حذف یک ردیف، گزارش همان تاریخ را از همه سبدها حذف می‌کند.' : `این جدول فقط گزارش‌های سبد «${esc(portfolioName(trendFilterPid))}» را نشان می‌دهد. حذف یک ردیف، گزارش همان تاریخ را فقط از همین سبد حذف می‌کند.`}</p>
      <div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>سرمایه‌گذاری</th><th>ارزش روز</th><th>سود فعلی</th><th>سود تحقق‌یافته</th><th>سود کلی</th>${isAdmin()?'<th></th>':''}</tr></thead><tbody>
      ${[...data].reverse().map(s=>`<tr>
        <td class="num">${s.date}</td><td class="num">${fmt(s.investment)}</td><td class="num">${fmt(s.value)}</td>
        <td class="num ${plClass(s.unrealized)}">${fmt(s.unrealized)}</td><td class="num ${plClass(s.realized)}">${fmt(s.realized)}</td>
        <td class="num ${plClass(s.overall)}">${fmt(s.overall)}</td>
        ${isAdmin()?`<td><button class="btn btn-xs btn-danger" data-del-snap-date="${esc(s.date)}" data-del-snap-pid="${esc(trendFilterPid)}">حذف</button></td>`:''}
      </tr>`).join('')}
      </tbody></table></div>
    </div>
  `;
  wrap.querySelectorAll('[data-trend-mode]').forEach(b=>b.addEventListener('click',()=>{ trendMode=b.dataset.trendMode; renderTrend(); }));
  wrap.querySelectorAll('[data-trend-chart]').forEach(b=>b.addEventListener('click',()=>{ trendChartType=b.dataset.trendChart; renderTrend(); }));
  const trendFilterSel=document.getElementById('trendPortfolioFilter');
  if(trendFilterSel) trendFilterSel.addEventListener('change', ()=>{ trendFilterPid=trendFilterSel.value; renderTrend(); });
  wireTrendTooltip(data);
}
function wireTrendTooltip(data){
  const tooltip=document.getElementById('trendTooltip');
  if(!tooltip) return;
  function tooltipHTML(s){
    return `
      <div class="dt-title"><span class="legend-dot" style="background:var(--gold)"></span>${esc(s.date)}</div>
      <div class="dt-row"><span>سرمایه‌گذاری</span><span class="num">${fmt(s.investment)}</span></div>
      <div class="dt-row"><span>ارزش روز</span><span class="num">${fmt(s.value)}</span></div>
      <div class="dt-row"><span>سود/زیان فعلی</span><span class="num ${plClass(s.unrealized)}">${fmt(s.unrealized)}</span></div>
      <div class="dt-row"><span>سود/زیان تحقق‌یافته</span><span class="num ${plClass(s.realized)}">${fmt(s.realized)}</span></div>
      <div class="dt-row"><span>سود/زیان کلی</span><span class="num ${plClass(s.overall)}">${fmt(s.overall)}</span></div>
    `;
  }
  function positionTip(evt){
    const pad=16, tw=220, th=170;
    let x=evt.clientX+pad, y=evt.clientY+pad;
    if(x+tw>window.innerWidth) x=evt.clientX-tw-pad;
    if(y+th>window.innerHeight) y=evt.clientY-th-pad;
    tooltip.style.left=Math.max(4,x)+'px';
    tooltip.style.top=Math.max(4,y)+'px';
  }
  function showTip(idx, evt){
    const s=data[idx]; if(!s) return;
    tooltip.innerHTML=tooltipHTML(s);
    tooltip.classList.remove('hidden');
    positionTip(evt);
  }
  function hideTip(){ tooltip.classList.add('hidden'); }
  document.querySelectorAll('.trend-dot').forEach(el=>{
    const idx=parseInt(el.dataset.ptIdx);
    el.addEventListener('mouseenter', e=>showTip(idx,e));
    el.addEventListener('mousemove', positionTip);
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('click', e=>{ e.stopPropagation(); showTip(idx,e); });
  });
  document.addEventListener('click', hideTip);
}
async function deleteSnapshotsForDate(date, pid){
  if(!requireAdmin('حذف گزارش')) return;
  const scoped = pid && pid!=='__all__';
  const affectedPids = scoped ? [pid] : Array.from(new Set(SNAPSHOTS.filter(s=>s.date===date).map(s=>s.portfolioId)));
  const cnt=affectedPids.length;
  const msg = scoped
    ? `گزارش تاریخ ${date} برای سبد «${portfolioName(pid)}» حذف شود؟`
    : `گزارش تاریخ ${date} برای همه سبدها (${cnt} مورد) حذف شود؟`;
  if(!confirm(msg)) return;
  try{
    await Promise.all(affectedPids.map(p=>apiSave(`/portfolios/${p}/snapshots/${date}`, {method:'DELETE'})));
    SNAPSHOTS=SNAPSHOTS.filter(s=>!(s.date===date && (!scoped || s.portfolioId===pid)));
    renderTrend(); renderDashboard();
    toast('گزارش حذف شد.');
  }catch(err){ toast(err.message, true); }
}

/* ---------- Ladders tab ---------- */
function renderLadders(){
  const wrap=document.getElementById('tab-ladders');
  if(!PORTFOLIOS.length){
    wrap.innerHTML = `<div class="card"><div class="empty">هنوز هیچ سبدی تعریف نشده.</div></div>`;
    return;
  }
  // Ladders are independent per portfolio (per الهه's design decision), and there is no
  // "active portfolio" filter anymore — so every portfolio's ladders are shown here at once,
  // grouped under its own heading.
  wrap.innerHTML = PORTFOLIOS.map(p=>renderLaddersForPortfolio(p)).join('');

  document.querySelectorAll('[data-ladder-cat]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      if(!requireAdmin('تغییر پله‌های سود')) { renderLadders(); return; }
      const pid=inp.dataset.ladderPid, cat=inp.dataset.ladderCat, idx=parseInt(inp.dataset.ladderIdx), field=inp.dataset.ladderField;
      const lm=ensurePortfolioLadders(pid);
      if(!lm[cat]) lm[cat]=JSON.parse(JSON.stringify(DEFAULT_LADDERS['سایر']));
      const previous = lm[cat][idx][field];
      lm[cat][idx][field]=Math.max(0,num(inp.value));
      try{
        const saved = await apiSave(`/portfolios/${pid}/ladders/${encodeURIComponent(cat)}`, {method:'PUT', body:{levels:lm[cat]}});
        lm[cat]=saved;
        renderLadders(); renderDashboard();
      }catch(err){
        lm[cat][idx][field]=previous; // roll back the optimistic local edit
        toast(err.message, true);
        renderLadders();
      }
    });
  });
  document.querySelectorAll('.withdraw-form').forEach(f=>{
    f.addEventListener('submit', async e=>{
      e.preventDefault();
      if(!requireAdmin('ثبت برداشت')) return;
      const pid=f.dataset.pid, cat=f.dataset.cat;
      const date=normalizeJalali(f.querySelector('.wd-date').value);
      const amount=num(f.querySelector('.wd-amount').value);
      const dest=f.querySelector('.wd-dest').value.trim();
      const note=f.querySelector('.wd-note').value.trim();
      const levelRaw=f.querySelector('.wd-level').value;
      const level = levelRaw===''? null : parseInt(levelRaw);
      if(!date){ toast('فرمت تاریخ درست نیست.',true); return; }
      if(amount<=0){ toast('مبلغ باید بزرگتر از صفر باشد.',true); return; }
      try{
        const created = await apiSave(`/portfolios/${pid}/withdrawals`, {method:'POST', body:{categoryId:cat, date, amount, dest, note, level}});
        WITHDRAWALS.push(created);
        toast('برداشت ثبت شد.');
        renderLadders();
        renderDashboard();
      }catch(err){ toast(err.message, true); }
    });
  });
  document.querySelectorAll('[data-secure-cat]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openSecureProfitModal(btn.dataset.securePid, btn.dataset.secureCat, parseInt(btn.dataset.secureIdx));
    });
  });
  document.querySelectorAll('[data-toggle-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.toggleCat;
      if(ladderOpenCats.has(key)) ladderOpenCats.delete(key); else ladderOpenCats.add(key);
      renderLadders();
    });
  });
  document.querySelectorAll('[data-toggle-asset-catkey]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const catKey = el.dataset.toggleAssetCatkey, name = el.dataset.toggleAssetName;
      ladderOpenAsset[catKey] = (ladderOpenAsset[catKey]===name) ? null : name;
      renderLadders();
    });
  });
}
// Renders the ladder/withdraw panel shared by a category — shown either directly under a
// category with no holdings, or under whichever asset row the user has expanded within it.
function renderLadderPanel(pid, cat, a, levels, wd, wdTotal){
  const ladderRows = levels.map((lv,idx)=>{
    const profitAtThreshold = a.investment * lv.t/100;
    const withdrawAmt = profitAtThreshold * lv.w/100;
    const targetValue = a.investment + profitAtThreshold;
    const remaining = targetValue - withdrawAmt;
    const achieved = a.profitPct >= lv.t && a.investment>1e-6;
    const progress = a.investment>1e-6 ? Math.min(100, Math.max(0, a.profitPct/lv.t*100)) : 0;
    const linkedWd = wd.filter(w=>w.level===idx);
    const securedAmt = linkedWd.reduce((s,w)=>s+w.amount,0);
    const isSecured = linkedWd.length>0;

    let statusHTML, barColor, actionHTML='';
    if(isSecured){
      statusHTML = `<span class="badge badge-buy">✓ سود این پله سیو شد</span>`;
      barColor = 'var(--green)';
      if(isAdmin()) actionHTML = `<button class="btn btn-xs" data-secure-pid="${esc(pid)}" data-secure-cat="${esc(cat)}" data-secure-idx="${idx}" style="margin-top:6px;">+ افزودن سیو دیگر برای این پله</button>`;
    } else if(achieved){
      statusHTML = `<span class="muted">🔔 به آستانه رسیده — هنوز سیو نشده</span>`;
      barColor = 'var(--gold)';
      if(isAdmin()) actionHTML = `<button class="btn btn-xs btn-secure" data-secure-pid="${esc(pid)}" data-secure-cat="${esc(cat)}" data-secure-idx="${idx}" style="margin-top:6px;">🔒 سیو سود این پله</button>`;
    } else {
      statusHTML = `<span class="muted">در انتظار</span>`;
      barColor = 'var(--border)';
    }

    return `<div class="ladder-row ${isSecured?'ladder-row-secured':''}">
      <div class="field" style="margin:0;"><label>آستانه سود٪</label><input type="text" inputmode="decimal" value="${lv.t}" data-ladder-pid="${esc(pid)}" data-ladder-cat="${esc(cat)}" data-ladder-idx="${idx}" data-ladder-field="t" ${isAdmin()?'':'readonly'}></div>
      <div class="field" style="margin:0;"><label>٪ برداشت از سود</label><input type="text" inputmode="decimal" value="${lv.w}" data-ladder-pid="${esc(pid)}" data-ladder-cat="${esc(cat)}" data-ladder-idx="${idx}" data-ladder-field="w" ${isAdmin()?'':'readonly'}></div>
      <div>
        <div class="muted" style="display:flex;justify-content:space-between;align-items:center;gap:6px;" title="سود فعلی این کتگوری نسبت به آستانه سود همین پله">${statusHTML}<span class="num">سود فعلی ${fmt(a.profitPct,0)}٪ از آستانه ${lv.t}٪</span></div>
        <div class="progress" title="میزان پیشرفت تا رسیدن به آستانه ${lv.t}٪"><div class="progress-bar" style="width:${progress}%;background:${barColor}"></div></div>
        ${isSecured? `<div class="muted" style="margin-top:4px;">مبلغ سیوشده: <span class="num pos">${fmt(securedAmt)}</span> (${linkedWd.length} برداشت)</div>` : ''}
        ${actionHTML}
      </div>
      <div style="text-align:left;" title="در صورت رسیدن به آستانه ${lv.t}٪، پیشنهاد می‌شود ${lv.w}٪ از سود آن (یعنی مبلغ روبرو) برداشت/سیو شود و باقی سرمایه در بازار بماند.">
        <div class="muted" style="font-size:12px;">برداشت پیشنهادی این پله</div>
        <div class="num" style="font-weight:700;">${fmt(withdrawAmt)}</div>
        <div class="muted" style="font-size:12px;margin-top:5px;">سرمایه باقی‌مانده پس از آن</div>
        <div class="num">${fmt(remaining)}</div>
      </div>
    </div>`;
  }).join('');

  return `<div class="stat-mini">
      <span>سرمایه‌گذاری: <b class="num">${fmt(a.investment)}</b></span>
      <span>ارزش روز: <b class="num">${fmt(a.value)}</b></span>
      <span>سود: <b class="num ${plClass(a.profit)}">${fmt(a.profit)}</b></span>
      <span>سود٪: <b class="num ${plClass(a.profitPct)}">${fmtPct(a.profitPct)}</b></span>
    </div>
    ${ladderRows}
    <div class="hr"></div>
    <details>
      <summary style="cursor:pointer;color:var(--ink-dim);font-size:14.5px;">برداشت واقعی سود از این کتگوری (${wd.length} ثبت، جمع <span class="num">${fmt(wdTotal)}</span>)</summary>
      ${isAdmin()?`<p class="small-note" style="margin-top:10px;">این فرم برای ثبت دستی برداشت‌هایی است که فروش واقعی در پی نداشته‌اند. اگر سود از فروش یک دارایی به دست آمده، بهتر است از دکمه «🔒 سیو سود این پله» در بالا استفاده کنید تا هم فروش ثبت شود و هم برداشت.</p>

        <div class="field-row">

          <div class="field"><label>مبلغ (تومان)</label><input type="text" inputmode="decimal" class="wd-amount" placeholder="0"></div>
        </div>

          <div class="field"><label>مقصد</label><input type="text" class="wd-dest" list="destList" placeholder="نقد تومان، صندوق، ..."></div>
          <div class="field"><label>توضیحات</label><input type="text" class="wd-note"></div>
        </div>
        <div class="field">
          <label>مربوط به کدام پله سود؟ (اختیاری)</label>
          <select class="wd-level">
            <option value="">بدون پله خاص (برداشت آزاد)</option>
            ${levels.map((lv,idx)=>`<option value="${idx}">پله ${idx+1} — آستانه سود ${lv.t}٪</option>`).join('')}
          </select>
        </div>
        <button class="btn btn-gold btn-xs" type="submit">ثبت برداشت</button>
      </form>`:''}
      ${wd.length? `<div class="table-wrap" style="margin-top:10px;"><table><thead><tr><th>تاریخ</th><th>مبلغ</th><th>پله</th><th>مقصد</th><th>توضیحات</th>${isAdmin()?'<th></th>':''}</tr></thead><tbody>
        ${wd.map(w=>{
          const lv = (w.level!=null && levels[w.level]) ? levels[w.level] : null;
          const levelBadge = lv ? `<span class="badge badge-buy">پله ${w.level+1} (${lv.t}٪)</span>` : `<span class="badge badge-cat">آزاد</span>`;
          return `<tr><td class="num">${w.date}</td><td class="num">${fmt(w.amount)}</td><td>${levelBadge}</td><td>${esc(w.dest||'—')}</td><td>${esc(w.note||'—')}</td>${isAdmin()?`<td><button class="btn btn-xs btn-danger" data-del-wd="${w.id}">حذف</button></td>`:''}</tr>`;
        }).join('')}
      </tbody></table></div>` : ''}
    </details>`;
}

function renderLaddersForPortfolio(p){
  const pid=p.id;
  const {holdings}=computeHoldingsForPortfolio(pid);
  const agg=categoryAgg(holdings);
  const levelsMap=ensurePortfolioLadders(pid);
  const cats = Array.from(new Set([...Object.keys(agg), ...knownCategoryIds()]));
  cats.sort((a,b)=> (agg[b]?.value||0)-(agg[a]?.value||0));

  const header = `<div class="card-head" style="margin-top:22px;"><h2 style="margin:0;">${esc(p.name)}</h2></div>`;

  const cards = cats.map(cat=>{
    const a = agg[cat] || {investment:0,value:0,profit:0,profitPct:0};
    if(!levelsMap[cat]) levelsMap[cat]=JSON.parse(JSON.stringify(DEFAULT_LADDERS['سایر']));
    const levels=levelsMap[cat];
    const wd = WITHDRAWALS.filter(w=>w.portfolioId===pid && w.categoryId===cat).sort((x,y)=>jalaliSortKey(y.date)-jalaliSortKey(x.date));
    const wdTotal = wd.reduce((s,w)=>s+w.amount,0);
    const catHoldings = holdings.filter(h=>h.categoryId===cat);

    const catKey = pid+'|'+cat;
    const isCatOpen = ladderOpenCats.has(catKey);
    const openAssetName = ladderOpenAsset[catKey];

    let bodyHTML='';
    if(isCatOpen){
      if(catHoldings.length){
        const assetRows = catHoldings.map(h=>{
          const isAssetOpen = openAssetName===h.name;
          const plHTML = h.hasPrice
            ? `<span class="num ${plClass(h.unrealized)}">${fmt(h.unrealized)} <span class="muted">(${fmtPct(h.unrealizedPct)})</span></span>`
            : `<span class="muted">قیمت روز وارد نشده</span>`;
          return `<div class="lad-asset">
            <div class="lad-asset-head" data-toggle-asset-catkey="${esc(catKey)}" data-toggle-asset-name="${esc(h.name)}">
              <div class="lad-asset-head-left">
                <button type="button" class="expand-toggle ${isAssetOpen?'open':''}" tabindex="-1"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                <span class="name">${esc(h.name)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:12px;">
                <span class="num muted">ارزش روز: ${fmt(h.value)}</span>
                ${plHTML}
              </div>
            </div>
            ${isAssetOpen ? `<div class="lad-asset-body">${renderLadderPanel(pid,cat,a,levels,wd,wdTotal)}</div>` : ''}
          </div>`;
        }).join('');
        bodyHTML = `<div class="lad-cat-body">${assetRows}</div>`;
      } else {
        // No holdings yet in this category — show the ladder/withdraw panel directly so
        // it can still be configured ahead of time.
        bodyHTML = `<div class="lad-cat-body"><div class="lad-empty empty">دارایی فعالی در این کتگوری نیست.</div>${renderLadderPanel(pid,cat,a,levels,wd,wdTotal)}</div>`;
      }
    }

    return `<div class="lad-cat">
      <div class="lad-cat-head" data-toggle-cat="${esc(catKey)}">
        <div class="lad-cat-head-left">
          <button type="button" class="expand-toggle ${isCatOpen?'open':''}" tabindex="-1"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h3>${esc(categoryName(cat))}</h3>
        </div>
        <div class="lad-cat-head-right">
          <span class="badge badge-cat">${catHoldings.length} دارایی</span>
          <span class="num ${plClass(a.profitPct)}">${fmtPct(a.profitPct)}</span>
        </div>
      </div>
      ${bodyHTML}
    </div>`;
  }).join('');

  return header + cards;
}

/* ---------- سیو سود modal: turns a ladder rung's target withdrawal into a real sell ---------- */
function closeSecureProfitModal(){
  document.getElementById('secureProfitModal').classList.add('hidden');
  document.getElementById('secureProfitModalBox').innerHTML='';
}
function openSecureProfitModal(pid, cat, idx){
  if(!requireAdmin('سیو سود')) return;
  const {holdings}=computeHoldingsForPortfolio(pid);
  const catHoldings = holdings.filter(h=>h.categoryId===cat && h.qty>1e-9);
  if(!catHoldings.length){ toast('دارایی بازی در این کتگوری برای فروش وجود ندارد.',true); return; }
  const levels = ensurePortfolioLadders(pid)[cat] || DEFAULT_LADDERS['سایر'];
  const lv = levels[idx];
  if(!lv) return;
  const agg = categoryAgg(holdings);
  const a = agg[cat] || {investment:0};
  const profitAtThreshold = a.investment * lv.t/100;
  const suggestedAmt = Math.max(0, profitAtThreshold * lv.w/100);
  const defaultAsset = catHoldings[0]; // holdings are pre-sorted by value desc
  renderSecureProfitModal(pid, cat, idx, lv, suggestedAmt, catHoldings, defaultAsset.name);
  document.getElementById('secureProfitModal').classList.remove('hidden');
}

  document.getElementById('secureProfitClose').addEventListener('click', closeSecureProfitModal);

    if(amount<=0){ toast('مبلغ فروش باید بزرگ‌تر از صفر باشد.',true); return; }
    if(fee>=amount){ toast('کارمزد نمی‌تواند برابر یا بیشتر از مبلغ فروش باشد.',true); return; }

    try{
      const r = await apiSave(`/portfolios/${pid}/secure-profit`, {method:'POST', body:{
        categoryId:cat, levelIdx:idx, asset:assetName, date, price, qty, amount, fee, accountId, location, note, dest,
      }});
      // The server wrote both rows atomically; mirror them into local state with the ids it returned
      // (sourceTxnId links the withdrawal back to the sell — see deleteTxn's un-secure logic).
      TXNS.push({id:r.sellTransactionId, ts:Date.now(), type:'sell', date, asset:assetName, categoryId:cat, accountId, qty, price, amount, fee, location, note, portfolioId:pid});

      closeSecureProfitModal();
      toast(r.message || 'فروش ثبت شد و سود این پله سیو شد.');
      renderAll();
    }catch(err){ toast(err.message, true); }
  });

/* ---------- Bulk import from Excel ----------
   Reads an .xlsx/.xls/.csv file client-side (via the SheetJS library loaded in <head>),
   maps its header row onto the app's transaction fields, validates every row (including a
   chronological check that no import row sells more of an asset than was bought by that
   date — combined with whatever is already in TXNS), shows a full preview with per-row
   errors, and only pushes the rows the admin confirms. Nothing is written until "تایید". */
const IMPORT_HEADER_ALIASES = {
  date: ['تاریخ','date'],
  type: ['نوع','نوع تراکنش','type'],
  asset: ['نام دارایی','دارایی','asset'],
  category: ['کتگوری','دسته','category'],
  qty: ['تعداد','تعداد / مقدار','مقدار','qty','quantity'],
  price: ['قیمت واحد','قیمت','price'],
  amount: ['مبلغ کل','مبلغ کل (تومان)','مبلغ','amount'],
  location: ['محل نگهداری / پلتفرم','محل نگهداری/پلتفرم','محل خرید / پلتفرم','محل','location'],
  note: ['توضیحات','یادداشت','note']
};
const IMPORT_TYPE_ALIASES = {
  'خرید':'buy','buy':'buy',
  'فروش':'sell','sell':'sell',
  'سود نقدی':'dividend','سود نقدی / مجمع':'dividend','سود نقدی/مجمع':'dividend','مجمع':'dividend','dividend':'dividend'
};
function normalizeHeaderText(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase(); }
function matchHeaderField(headerText){
  const norm = normalizeHeaderText(headerText);
  if(!norm) return null;
  for(const [field,aliases] of Object.entries(IMPORT_HEADER_ALIASES)){
    if(aliases.some(a=>normalizeHeaderText(a)===norm)) return field;
  }
  // fallback: loose containment match, in case the sheet's header has extra words
  // (e.g. "قیمت واحد (تومان)") that don't exactly match the template
  for(const [field,aliases] of Object.entries(IMPORT_HEADER_ALIASES)){
    if(aliases.some(a=>{ const an=normalizeHeaderText(a); return an && (norm.includes(an) || an.includes(norm)); })) return field;
  }
  return null;
}
function parseImportTypeText(val){ return IMPORT_TYPE_ALIASES[normalizeHeaderText(val)] || null; }
// Accepts a Jalali date string (1404/01/15), a Gregorian string Excel may have
// auto-formatted (2025-04-05), or a real JS Date (when a cell has Excel date formatting) —
// and always returns a normalized Jalali string, since that's the only calendar the rest
// of the app understands. Year range is the disambiguator between Jalali/Gregorian text.
function parseImportDate(val){
  if(val==null || val==='') return null;
  if(val instanceof Date && !isNaN(val)){
    const [jy,jm,jd]=gregorianToJalali(val.getUTCFullYear(), val.getUTCMonth()+1, val.getUTCDate());
    return `${String(jy).padStart(4,'0')}/${pad2(jm)}/${pad2(jd)}`;
  }
  const s=toEnDigits(String(val)).trim();
  const m=s.match(/^(\d{3,4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(!m) return null;
  const y=parseInt(m[1]);
  if(y>=1300 && y<=1500) return normalizeJalali(s); // sane Jalali year range (today is ~1404)
  if(y>=1900 && y<=2100){
    const gmo=parseInt(m[2]), gd=parseInt(m[3]);
    if(gmo<1||gmo>12||gd<1||gd>31) return null;
    const [jy,jm,jd]=gregorianToJalali(y,gmo,gd);
    return `${String(jy).padStart(4,'0')}/${pad2(jm)}/${pad2(jd)}`;
  }
  return normalizeJalali(s);
}
let importParsedRows=[];
function openImportExcelModal(){
  if(!requireAdmin('درون‌ریزی از اکسل')) return;
  if(!addTabPortfolioId){ toast('ابتدا یک سبد بسازید.',true); return; }
  importParsedRows=[];
  document.getElementById('importExcelModalBox').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <h3>📥 درون‌ریزی گروهی تراکنش‌ها از اکسل — سبد «${esc(portfolioName(addTabPortfolioId))}»</h3>
      <button type="button" class="modal-close" id="importExcelClose">✕</button>
    </div>
    <p class="small-note">فایل اکسل (.xlsx) یا CSV با ستون‌های «تاریخ، نوع، نام دارایی، کتگوری، تعداد، قیمت واحد، مبلغ کل، محل نگهداری، توضیحات» را انتخاب کنید — ردیف اول باید عنوان ستون‌ها باشد. تاریخ می‌تواند شمسی (1404/01/15) یا میلادی باشد. پیش از ثبت نهایی همه ردیف‌ها و خطاهای احتمالی به شما نشان داده می‌شود و چیزی ذخیره نمی‌شود تا روی «تایید» بزنید.</p>
    <input type="file" id="importFileInput" accept=".xlsx,.xls,.csv" style="margin-top:8px;">
    <div id="importPreviewWrap" style="margin-top:14px;"></div>
  `;
  document.getElementById('importExcelClose').addEventListener('click', closeImportExcelModal);
  document.getElementById('importFileInput').addEventListener('change', e=>{
    const file=e.target.files[0];

}
function closeImportExcelModal(){
  document.getElementById('importExcelModal').classList.add('hidden');
  document.getElementById('importExcelModalBox').innerHTML='';

}
function handleImportFile(file){
  const wrap=document.getElementById('importPreviewWrap');
  wrap.innerHTML = `<div class="muted">در حال خواندن فایل...</div>`;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array', cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1, defval:'', raw:true});
      processImportAOA(aoa);
    }catch(err){
      wrap.innerHTML = `<div class="empty">خطا در خواندن فایل: ${esc(err.message||String(err))}</div>`;
    }
  };
  reader.onerror=()=>{ wrap.innerHTML = `<div class="empty">فایل قابل خواندن نبود.</div>`; };
  reader.readAsArrayBuffer(file);
}
function processImportAOA(aoa){
  const wrap=document.getElementById('importPreviewWrap');
  if(!aoa.length){ wrap.innerHTML=`<div class="empty">فایل خالی است.</div>`; return; }
  const headerRow=aoa[0];
  const colField=headerRow.map(h=>matchHeaderField(h));
  const REQUIRED=['date','type','asset','qty','price','amount'];
  const missing=REQUIRED.filter(f=>!colField.includes(f));
  if(missing.length){
    const missingLabels=missing.map(f=>IMPORT_HEADER_ALIASES[f][0]).join('، ');
    wrap.innerHTML = `<div class="empty">این ستون‌ها در فایل پیدا نشد: <b>${esc(missingLabels)}</b>. از فرم نمونه اکسل استفاده کنید و ردیف اول را عنوان ستون‌ها نگه دارید.</div>`;
    return;
  }
  const dataRows=aoa.slice(1).filter(r=>r.some(c=>String(c).trim()!==''));
  if(!dataRows.length){ wrap.innerHTML=`<div class="empty">هیچ ردیف داده‌ای پیدا نشد.</div>`; return; }

  const parsed=dataRows.map((row,i)=>{
    const rowNum=i+2; // +1 to leave 0-index, +1 for the header row
    const raw={};
    colField.forEach((f,ci)=>{ if(f) raw[f]=row[ci]; });
    const errors=[];
    const type=parseImportTypeText(raw.type);
    if(!type) errors.push('نوع تراکنش نامعتبر است (باید خرید / فروش / سود نقدی باشد)');
    const date=parseImportDate(raw.date);
    if(!date) errors.push('تاریخ نامعتبر یا خالی است');
    const asset=String(raw.asset==null?'':raw.asset).trim();
    if(!asset) errors.push('نام دارایی خالی است');
    const categoryRaw=String(raw.category==null?'':raw.category).trim();
    const categoryId = categoryRaw ? (categoryIdByName(categoryRaw) || categoryIdByName('سایر')) : categoryIdByName('سایر');
    const location=String(raw.location==null?'':raw.location).trim();
    const note=String(raw.note==null?'':raw.note).trim();
    let qty=num(raw.qty), price=num(raw.price), amount=num(raw.amount);
    if(type==='dividend'){
      qty=0; price=0;
      if(amount<=0) errors.push('برای سود نقدی، مبلغ کل باید بزرگ‌تر از صفر باشد');
    } else if(type){
      if(amount<=0 && qty>0 && price>0) amount=qty*price;
      if(price<=0 && qty>0 && amount>0) price=amount/qty;
      if(qty<=0) errors.push('تعداد باید بزرگ‌تر از صفر باشد');
      if(amount<=0) errors.push('مبلغ کل نامعتبر است (تعداد و قیمت واحد را هم کامل وارد کنید)');
    }
    const txn = (errors.length===0 && date && type) ? {type,date,asset,categoryId,qty,price,amount,location,note} : null;
    return {rowNum, raw, errors, txn};
  });

  // Only structurally-valid rows enter the chronological oversell check. Scoped to the
  // target portfolio's own existing transactions — a buy in a different portfolio must
  // never cover a sell being imported into this one.
  const structurallyValid = parsed.filter(r=>r.txn).map(r=>({rowNum:r.rowNum, txn:r.txn}));
  if(structurallyValid.some(r=>r.txn.type==='sell')){
    const sellErrors=validateImportSellSequence(txnsForPortfolio(addTabPortfolioId), structurallyValid);
    parsed.forEach(r=>{
      if(sellErrors.has(r.rowNum)){ r.errors.push(sellErrors.get(r.rowNum)); r.txn=null; }
    });
  }

  importParsedRows=parsed;
  renderImportPreview(parsed);
}
// Simulates buys/sells in date order across the existing ledger PLUS this import batch, to
// catch a sell row that would oversell an asset given what's bought earlier in the same
// batch (or already in TXNS) — the same rule computeHoldings() enforces one row at a time,
// applied here across the whole batch before anything is committed.
function validateImportSellSequence(existingTxns, candidateRows){
  const errors=new Map();
  const combined=[
    ...existingTxns.map(t=>({type:t.type,date:t.date,asset:t.asset,qty:t.qty,__rowNum:null})),
    ...candidateRows.map(r=>({type:r.txn.type,date:r.txn.date,asset:r.txn.asset,qty:r.txn.qty,__rowNum:r.rowNum}))
  ];
  combined.sort((a,b)=> jalaliSortKey(a.date)-jalaliSortKey(b.date) || ((a.__rowNum||0)-(b.__rowNum||0)));
  const qtyByAsset={};
  combined.forEach(t=>{
    if(t.type==='buy'){
      qtyByAsset[t.asset]=(qtyByAsset[t.asset]||0)+t.qty;
    } else if(t.type==='sell'){
      const avail=qtyByAsset[t.asset]||0;
      if(t.qty > avail+1e-6){
        if(t.__rowNum) errors.set(t.__rowNum, `فروش ${fmt(t.qty,4)} از «${t.asset}» بیشتر از موجودی محاسبه‌شده تا این تاریخ (${fmt(avail,4)}) است.`);
        qtyByAsset[t.asset]=0;
      } else {
        qtyByAsset[t.asset]=avail-t.qty;
      }
    }
  });
  return errors;
}
function renderImportPreview(parsed){
  const wrap=document.getElementById('importPreviewWrap');
  const validRows=parsed.filter(r=>r.txn);
  const invalidRows=parsed.filter(r=>!r.txn);
  const rowsHTML=parsed.map(r=>{
    const t=r.txn;
    const typeLabel = t ? (t.type==='buy'?'خرید':t.type==='sell'?'فروش':'سود نقدی') : esc(String(r.raw.type||'—'));
    return `<tr class="${r.errors.length?'import-row-error':'import-row-ok'}">
      <td class="num">${r.rowNum}</td>
      <td>${r.errors.length? `<span class="import-status-err">✕ ${r.errors.map(esc).join(' — ')}</span>` : `<span class="import-status-ok">✓ معتبر</span>`}</td>
      <td class="num">${t?esc(t.date):esc(String(r.raw.date||'—'))}</td>
      <td>${typeLabel}</td>
      <td>${esc(t?t.asset:String(r.raw.asset||'—'))}</td>
      <td>${esc(t?categoryName(t.categoryId):String(r.raw.category||'—'))}</td>
      <td class="num">${t && t.type!=='dividend' ? fmt(t.qty,4) : '—'}</td>
      <td class="num">${t && t.type!=='dividend' ? fmt(t.price) : '—'}</td>
      <td class="num">${t? fmt(t.amount) : '—'}</td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `
    <div class="table-wrap" style="max-height:360px; overflow-y:auto;"><table><thead><tr>
      <th>#</th><th>وضعیت</th><th>تاریخ</th><th>نوع</th><th>دارایی</th><th>کتگوری</th><th>تعداد</th><th>قیمت واحد</th><th>مبلغ</th>
    </tr></thead><tbody>${rowsHTML}</tbody></table></div>
    <div class="muted" style="margin-top:10px;">
      <span class="num pos">${validRows.length}</span> ردیف معتبر از <span class="num">${parsed.length}</span> ردیف${invalidRows.length? ` — <span class="num neg">${invalidRows.length}</span> ردیف دارای خطا وارد نمی‌شود` : ''}
    </div>
    <button class="btn btn-gold btn-block" id="btnConfirmImport" style="margin-top:12px;" ${validRows.length?'':'disabled'}>تایید و درون‌ریزی ${validRows.length} تراکنش معتبر</button>
  `;
  if(validRows.length){
    document.getElementById('btnConfirmImport').addEventListener('click', ()=>confirmImportRows(validRows));
  }
}
async function confirmImportRows(validRows){
  if(!requireAdmin('درون‌ریزی از اکسل')) return;
  if(!validRows.length) return;
  if(!confirm(`${validRows.length} تراکنش معتبر در سبد «${portfolioName(addTabPortfolioId)}» ثبت شود؟ این کار قابل بازگشت نیست (اما بعداً می‌توانید هرکدام را جداگانه حذف یا ویرایش کنید).`)) return;
  const pid=addTabPortfolioId;
  const btn=document.getElementById('btnConfirmImport');
  if(btn){ btn.disabled=true; btn.textContent='در حال ثبت...'; }
  let okCount=0, firstError=null;
  // Sequential (not Promise.all) on purpose: each row's sell-quantity validation depends on
  // the rows already committed before it, exactly like typing them in one at a time.
  for(const r of validRows){
    try{
      const created = await apiFetch(`/portfolios/${pid}/transactions`, {method:'POST', body:r.txn});
      TXNS.push({id:created.id, ts:created.ts, type:created.type, date:created.date, asset:created.asset, categoryId:created.categoryId, accountId:created.accountId, qty:created.qty, price:created.price, amount:created.amount, fee:created.fee, location:created.location, note:created.note, portfolioId:created.portfolioId});
      okCount++;
    }catch(err){ if(!firstError) firstError=err.message; }
  }
  closeImportExcelModal();
  if(okCount) toast(`${okCount} از ${validRows.length} تراکنش با موفقیت درون‌ریزی شد.` + (firstError? ` (اولین خطا: ${firstError})` : ''), !!firstError);
  else toast(`درون‌ریزی ناموفق بود: ${firstError||''}`, true);
  renderAll();
}

  document.getElementById('btnCancelEditUser').addEventListener('click', ()=>{ editingUserId=null; renderUsers(); });

  });

    e.preventDefault();
    const name=document.getElementById('u_name').value.trim();
    const username=document.getElementById('u_username').value.trim();
    const pass=document.getElementById('u_pass').value;
    const role=document.getElementById('u_role').value;
    const allowedTabs=Array.from(document.querySelectorAll('.u-tab-perm:checked')).map(cb=>cb.value);
    if(!username){ toast('نام کاربری را وارد کنید.',true); return; }
    const dupe=USERS.find(u=>u.username.toLowerCase()===username.toLowerCase() && u.id!==editingUserId);
    if(dupe){ toast('این نام کاربری قبلاً استفاده شده.',true); return; }

    try{
      if(editingUserId){
        const u=USERS.find(x=>x.id===editingUserId);
        if(u.role==='admin' && role!=='admin' && USERS.filter(x=>x.role==='admin').length<=1){
          toast('نمی‌توانید تنها مدیر باقی‌مانده را به کاربر عادی تبدیل کنید.',true); return;

        if(pass && pass.length<4){ toast('رمز عبور باید حداقل ۴ کاراکتر باشد.',true); return; }
        const body={displayName:name||username, role, allowedTabs};
        if(pass) body.password=pass;
        const updated = await apiSave(`/users/${editingUserId}`, {method:'PUT', body});
        Object.assign(u, {displayName:updated.displayName, role:updated.role, allowedTabs:updated.allowedTabs});
        if(CURRENT_USER && CURRENT_USER.id===u.id){ CURRENT_USER=u; }
        editingUserId=null;
        toast('کاربر ویرایش شد.');
      } else {
        if(!pass || pass.length<4){ toast('رمز عبور باید حداقل ۴ کاراکتر باشد.',true); return; }
        const created = await apiSave('/users', {method:'POST', body:{username, password:pass, displayName:name||username, role, allowedTabs}});
        USERS.push(created);
        toast('کاربر جدید اضافه شد.');
      }
      renderUsers();
      updateUserBar();
    }catch(err){ toast(err.message, true); }
  });
}
function startEditUser(id){

  document.getElementById('userForm').scrollIntoView({behavior:'smooth',block:'start'});
}
async function deleteUser(id){

  if(u.role==='admin' && USERS.filter(x=>x.role==='admin').length<=1){ toast('حداقل یک مدیر باید در سامانه باقی بماند.',true); return; }

/* ---------- Management hub tab («مدیریت») — combines Add-transaction, Categories, Accounts,
   and Users into one place, since they're all "configure how the ledger works" actions rather
   than day-to-day reporting. A regular user only ever sees "ثبت تراکنش" here (if granted that
   permission) — categories/accounts/users remain admin-only, enforced again server-side. ---------- */
function availableManageViews(){
  if(isAdmin()) return ['add','categories','accounts','users'];
  return isTabAllowedForCurrentUser('add') ? ['add'] : [];
}
const MANAGE_VIEW_META={
  add:        {label:'ثبت تراکنش',  icon:'➕', desc:'ثبت خرید، فروش یا سود نقدی برای هر سبد'},
  categories: {label:'کتگوری‌ها',    icon:'🏷️', desc:'ساخت، تغییر نام یا حذف کتگوری‌ها'},
  accounts:   {label:'حساب‌ها',      icon:'💰', desc:'حساب‌های نقدی، واریز/برداشت/انتقال بین آن‌ها'},
  users:      {label:'کاربران',      icon:'👤', desc:'مدیریت کاربران و سطح دسترسی هرکدام'},
};
function renderManageTab(){
  const wrap=document.getElementById('tab-manage');
  if(!wrap || wrap.classList.contains('hidden')) return; // don't waste work rendering a tab nobody's looking at
  const available=availableManageViews();
  if(!available.length){ document.getElementById('manageHub').innerHTML=''; return; }
  if(!manageView || !available.includes(manageView)) manageView = available[0];

  const hubEl=document.getElementById('manageHub');
  if(available.length>1){
    hubEl.innerHTML = `<div class="manage-hub-cards" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;">
      ${available.map(v=>{
        const m=MANAGE_VIEW_META[v];
        return `<button type="button" class="card manage-hub-card ${manageView===v?'active':''}" data-manage-view="${v}"
          style="flex:1; min-width:150px; text-align:center; cursor:pointer; border:1px solid ${manageView===v?'var(--gold)':'var(--border)'}; padding:16px 10px;">
          <div style="font-size:25px;">${m.icon}</div>
          <div style="font-weight:700; margin-top:6px; font-size:15px;">${m.label}</div>
          <div class="muted" style="font-size:12.5px; margin-top:4px;">${m.desc}</div>
        </button>`;
      }).join('')}
    </div>`;
    hubEl.querySelectorAll('[data-manage-view]').forEach(btn=>{
      btn.addEventListener('click', ()=>switchManageView(btn.dataset.manageView));
    });
  } else {
    hubEl.innerHTML=''; // only one thing this user can do here — skip the hub chrome entirely
  }

  ['add','categories','accounts','users'].forEach(v=>{
    document.getElementById('tab-'+v).classList.toggle('hidden', v!==manageView);
  });
  if(manageView==='add') renderAddTab();
  else if(manageView==='categories') renderCategories();
  else if(manageView==='accounts') renderAccounts();
  else if(manageView==='users') renderUsers();
}
function switchManageView(view){
  manageView=view;
  renderManageTab();
}

    try{
      if(editingAccountId){
        await apiSave(`/accounts/${editingAccountId}`, {method:'PUT', body:{name, openingBalance}});
        editingAccountId=null;
        toast('حساب ویرایش شد.');
      } else {
        await apiSave('/accounts', {method:'POST', body:{name, openingBalance}});
        toast('حساب جدید اضافه شد.');
      }
      await refreshAccounts();
      renderAccounts();
      renderAddTab(); // the account select in the transaction form needs the new list too
    }catch(err){ toast(err.message, true); }
  });

  const transferForm=document.getElementById('transferForm');
  if(transferForm) transferForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fromAccountId=document.getElementById('tr_from').value;
    const toAccountId=document.getElementById('tr_to').value;
    const date=normalizeJalali(document.getElementById('tr_date').value);
    const amount=num(document.getElementById('tr_amount').value);
    const note=document.getElementById('tr_note').value.trim();
    if(fromAccountId===toAccountId){ toast('حساب مبدا و مقصد باید متفاوت باشند.',true); return; }
    if(!date){ toast('فرمت تاریخ درست نیست.',true); return; }
    if(amount<=0){ toast('مبلغ باید بزرگتر از صفر باشد.',true); return; }
    try{
      await apiSave('/accounts/transfer', {method:'POST', body:{fromAccountId, toAccountId, date, amount, note}});
      delete ACCOUNT_MOVEMENTS_CACHE[fromAccountId];
      delete ACCOUNT_MOVEMENTS_CACHE[toAccountId];
      await refreshAccounts();
      renderAccounts();
      toast('انتقال ثبت شد.');
    }catch(err){ toast(err.message, true); }
  });

  document.querySelectorAll('[data-toggle-account]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-edit-account],[data-del-account]')) return; // let those buttons' own handlers run instead
      const id=el.dataset.toggleAccount;
      expandedAccountId = expandedAccountId===id ? null : id;
      renderAccounts();
      if(expandedAccountId) loadAccountDetail(expandedAccountId);
    });
  });
  if(expandedAccountId) loadAccountDetail(expandedAccountId);
}
// Merges this account's manual deposit/withdraw/transfer rows with every buy/sell/dividend
// transaction that was paid through it into one chronological ledger — fetches the manual
// movements lazily (only when a row is actually expanded) and caches them so re-rendering
// the tab (e.g. after an unrelated edit) doesn't refetch every time.
async function loadAccountDetail(accountId){
  if(!ACCOUNT_MOVEMENTS_CACHE[accountId]){
    ACCOUNT_MOVEMENTS_CACHE[accountId] = await safeLoad(()=>apiFetch(`/accounts/${accountId}/movements`), []);
  }
  renderAccountDetail(accountId);
}
function renderAccountDetail(accountId){
  const el=document.getElementById(`accountDetail-${accountId}`);
  if(!el) return; // row got collapsed again before the fetch resolved
  const account=allAccounts().find(a=>a.id===accountId);
  if(!account) return;
  const movements = ACCOUNT_MOVEMENTS_CACHE[accountId] || [];
  const linkedTxns = TXNS.filter(t=>t.accountId===accountId);
  const showPortfolioTag = PORTFOLIOS.length>1;

  const ledger = [
    ...movements.map(m=>({date:m.date, ts:m.ts, kind:'movement', typeLabel:movementTypeLabel(m.type), signed:movementCashImpact(m), note:m.note||'—'})),
    ...linkedTxns.map(t=>({date:t.date, ts:t.ts, kind:'txn', typeLabel:`${typeBadgeText(t.type)} — ${t.asset}${showPortfolioTag?' ('+portfolioName(t.portfolioId)+')':''}`, signed:txnCashImpact(t), note:t.note||'—'})),
  ].sort((a,b)=> jalaliSortKey(b.date)-jalaliSortKey(a.date) || (b.ts-a.ts));

  const historyRows = ledger.map(x=>`<tr>
    <td class="num">${x.date}</td>
    <td>${esc(x.typeLabel)}</td>
    <td class="num ${plClass(x.signed)}">${x.signed>=0?'+':''}${fmt(x.signed)}</td>
    <td>${esc(x.note)}</td>
  </tr>`).join('');

  el.innerHTML = `
    <div class="field-row">
      <form id="depositForm-${accountId}" style="flex:1;">
        <div class="field"><label>واریز — تاریخ</label><input type="text" class="dep-date" value="${todayJalali()}"></div>
        <div class="field"><label>مبلغ (تومان)</label><input type="text" inputmode="decimal" class="dep-amount" placeholder="0"></div>
        <div class="field"><label>توضیحات (اختیاری)</label><input type="text" class="dep-note"></div>
        <button class="btn btn-xs" type="submit" style="width:100%;">ثبت واریز</button>
      </form>
      <form id="withdrawForm-${accountId}" style="flex:1;">
        <div class="field"><label>برداشت — تاریخ</label><input type="text" class="wd-date" value="${todayJalali()}"></div>
        <div class="field"><label>مبلغ (تومان)</label><input type="text" inputmode="decimal" class="wd-amount" placeholder="0"></div>
        <div class="field"><label>توضیحات (اختیاری)</label><input type="text" class="wd-note"></div>
        <button class="btn btn-xs btn-secure" type="submit" style="width:100%;">ثبت برداشت</button>
      </form>
    </div>
    <div class="hr"></div>
    <div class="muted" style="font-size:14px;margin-bottom:6px;">تاریخچه عملیات این حساب (${ledger.length} مورد)</div>
    ${ledger.length? `<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>نوع</th><th>مبلغ</th><th>توضیحات</th></tr></thead><tbody>${historyRows}</tbody></table></div>`
      : `<div class="empty" style="padding:10px 2px;">هنوز هیچ واریز، برداشت یا تراکنشی برای این حساب ثبت نشده.</div>`}
  `;

  document.getElementById(`depositForm-${accountId}`).addEventListener('submit', async e=>{
    e.preventDefault();
    const form=e.target;
    const date=normalizeJalali(form.querySelector('.dep-date').value);
    const amount=num(form.querySelector('.dep-amount').value);
    const note=form.querySelector('.dep-note').value.trim();
    if(!date){ toast('فرمت تاریخ درست نیست.',true); return; }
    if(amount<=0){ toast('مبلغ باید بزرگتر از صفر باشد.',true); return; }
    try{
      await apiSave(`/accounts/${accountId}/deposit`, {method:'POST', body:{date, amount, note}});
      delete ACCOUNT_MOVEMENTS_CACHE[accountId];
      await refreshAccounts();
      renderAccounts();
      await loadAccountDetail(accountId);
      toast('واریز ثبت شد.');
    }catch(err){ toast(err.message, true); }
  });
  document.getElementById(`withdrawForm-${accountId}`).addEventListener('submit', async e=>{
    e.preventDefault();
    const form=e.target;
    const date=normalizeJalali(form.querySelector('.wd-date').value);
    const amount=num(form.querySelector('.wd-amount').value);
    const note=form.querySelector('.wd-note').value.trim();
    if(!date){ toast('فرمت تاریخ درست نیست.',true); return; }
    if(amount<=0){ toast('مبلغ باید بزرگتر از صفر باشد.',true); return; }
    try{
      await apiSave(`/accounts/${accountId}/withdraw`, {method:'POST', body:{date, amount, note}});
      delete ACCOUNT_MOVEMENTS_CACHE[accountId];
      await refreshAccounts();
      renderAccounts();
      await loadAccountDetail(accountId);
      toast('برداشت ثبت شد.');
    }catch(err){ toast(err.message, true); }
  });
}
function startEditAccount(id){ editingAccountId=id; renderAccounts(); }
async function deleteAccount(id){
  const acc=allAccounts().find(a=>a.id===id); if(!acc) return;
  if(!confirm(`حساب «${acc.name}» حذف شود؟`)) return;
  try{
    await apiSave(`/accounts/${id}`, {method:'DELETE'});
    delete ACCOUNT_MOVEMENTS_CACHE[id];
    if(expandedAccountId===id) expandedAccountId=null;
    await refreshAccounts();
    renderAccounts();
    renderAddTab();
    toast('حساب حذف شد.');
  }catch(err){ toast(err.message, true); }
}

/* ---------- restore ----------
   This used to replace all local-storage data from a downloaded JSON backup file. Now that
   the backend/database is the single source of truth, that flow doesn't apply — restoring
   data means restoring the server's SQLite file (daftar_backend/daftar.sqlite3) itself,
   e.g. from a filesystem-level backup, not something this UI can do. Kept as a stub (button
   is hidden, see updateUserBar) so nothing else needs to change if a real "import" feature
   is added later. */
function doRestore(_file){
  toast('بازیابی از فایل محلی دیگر پشتیبانی نمی‌شود؛ داده‌ها اکنون روی سرور نگه‌داری می‌شوند.', true);
}

/* ---------- tabs / wiring ---------- */
function switchTab(name){
  // Enforced here (not just by hiding the nav button) so a data-goto link or any other
  // programmatic jump can't bypass a tab a "کاربر عادی" was explicitly denied.
  if(name==='manage'){
    if(!isAdmin() && !isTabAllowedForCurrentUser('add')){
      toast('دسترسی شما به این بخش محدود شده است.', true);
      return;
    }
  } else if(TAB_KEYS_PERMISSIBLE.includes(name) && !isTabAllowedForCurrentUser(name)){
    toast('دسترسی شما به این بخش محدود شده است.', true);
    return;
  }
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  ['dashboard','manage','holdings','sold','trend','ladders','portfolios'].forEach(n=>{
    document.getElementById('tab-'+n).classList.toggle('hidden', n!==name);
  });
  if(name==='manage') renderManageTab();
}
function renderAll(){
  renderKPI(); renderDashboard(); renderManageTab(); renderHoldings(); renderSold(); renderTrend(); renderLadders(); renderPortfolios();
  updateUserBar();
}

document.getElementById('tabs').addEventListener('click', e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  switchTab(b.dataset.tab);
});
document.addEventListener('click', e=>{
  const goto=e.target.closest('[data-goto]');
  if(goto){
    switchTab(goto.dataset.goto); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===goto.dataset.goto)); return;
  }
  const edit=e.target.closest('[data-edit-txn]'); if(edit){ if(!requireAdmin('ویرایش تراکنش')) return; editTxn(edit.dataset.editTxn); return; }
  const del=e.target.closest('[data-del-txn]'); if(del){ if(!requireAdmin('حذف تراکنش')) return; deleteTxn(del.dataset.delTxn); return; }
  const delWd=e.target.closest('[data-del-wd]'); if(delWd){
    if(!requireAdmin('حذف برداشت')) return;
    if(confirm('این برداشت حذف شود؟')){
      const wid=delWd.dataset.delWd;
      apiSave(`/withdrawals/${wid}`, {method:'DELETE'})
        .then(()=>{ WITHDRAWALS=WITHDRAWALS.filter(w=>w.id!==wid); renderLadders(); renderDashboard(); toast('برداشت حذف شد.'); })
        .catch(err=>toast(err.message, true));
    }
    return;
  }
  const delSnap=e.target.closest('[data-del-snap-date]'); if(delSnap){ if(!requireAdmin('حذف گزارش')) return; deleteSnapshotsForDate(delSnap.dataset.delSnapDate, delSnap.dataset.delSnapPid); return; }
  const editUserBtn=e.target.closest('[data-edit-user]'); if(editUserBtn){ if(!requireAdmin('مدیریت کاربران')) return; startEditUser(editUserBtn.dataset.editUser); return; }
  const delUserBtn=e.target.closest('[data-del-user]'); if(delUserBtn){ if(!requireAdmin('حذف کاربر')) return; deleteUser(delUserBtn.dataset.delUser); return; }
  const editPortBtn=e.target.closest('[data-edit-portfolio]'); if(editPortBtn){ if(!requireAdmin('مدیریت سبدها')) return; startEditPortfolio(editPortBtn.dataset.editPortfolio); return; }
  const delPortBtn=e.target.closest('[data-del-portfolio]'); if(delPortBtn){ if(!requireAdmin('حذف سبد')) return; deletePortfolio(delPortBtn.dataset.delPortfolio); return; }
  const openPortBtn=e.target.closest('[data-open-portfolio]'); if(openPortBtn){ openPortfolio(openPortBtn.dataset.openPortfolio); return; }
  const editCatBtn=e.target.closest('[data-edit-category]'); if(editCatBtn){ if(!requireAdmin('مدیریت کتگوری‌ها')) return; startEditCategory(editCatBtn.dataset.editCategory); return; }
  const delCatBtn=e.target.closest('[data-del-category]'); if(delCatBtn){ if(!requireAdmin('حذف کتگوری')) return; deleteCategory(delCatBtn.dataset.delCategory); return; }
  const editAccBtn=e.target.closest('[data-edit-account]'); if(editAccBtn){ if(!requireAdmin('مدیریت حساب‌ها')) return; startEditAccount(editAccBtn.dataset.editAccount); return; }
  const delAccBtn=e.target.closest('[data-del-account]'); if(delAccBtn){ if(!requireAdmin('حذف حساب')) return; deleteAccount(delAccBtn.dataset.delAccount); return; }
});
document.getElementById('ledgerRoot').addEventListener('input', e=>{
  if(e.target.id==='txnSearch'){ renderTxnLog(e.target.value); }
});

document.getElementById('btnRestoreTrigger').addEventListener('click', ()=>{ if(requireAdmin('بازیابی پشتیبان')) document.getElementById('fileRestore').click(); });
document.getElementById('fileRestore').addEventListener('change', e=>{ if(e.target.files[0]) doRestore(e.target.files[0]); e.target.value=''; });
document.getElementById('btnLogout').addEventListener('click', logout);

/* ---------- init ---------- */
(async function init(){
  if(getToken()){ await loadAllFromApi(); }
  renderAuth();
  if(CURRENT_USER){ renderAll(); }
})();

})();
</script>
